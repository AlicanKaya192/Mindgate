<style>
/* Dashboard: control desk. Three dark palettes carry the same roles, so switching one never moves the layout. */
#dash-root, #dash-root[data-palette="ink"], .mg, .mg[data-palette="ink"] {
  --ground: #0b1020; --panel: #121a2b; --panel-2: #18223a; --line: #26324c;
  --text: #e6e3dc; --muted: #9aa2ab; --accent: #8ab4f0; --accent-ground: #1c2a3d;
  --good: #6fc59a; --warn: #e5ae5b; --bad: #ee8379;
  --c1: #8ab4f0; --c2: #e5ae5b; --c3: #b59cf0; --c4: #6fc59a; --c5: #ee8fa8; --c6: #9aa2ab;
}
#dash-root[data-palette="graphite"], .mg[data-palette="graphite"] {
  --ground: #161412; --panel: #1f1c19; --panel-2: #28241f; --line: #3a342d;
  --text: #ece8e1; --muted: #a39e95; --accent: #d9925f; --accent-ground: #3a271a;
  --good: #8cc08a; --warn: #e6c15a; --bad: #e8796b;
  --c1: #d9925f; --c2: #e6c15a; --c3: #8cb4c9; --c4: #8cc08a; --c5: #c99ac0; --c6: #a39e95;
}
#dash-root[data-palette="pine"], .mg[data-palette="pine"] {
  --ground: #091612; --panel: #0f221b; --panel-2: #152c24; --line: #223d32;
  --text: #e3ede8; --muted: #93a79f; --accent: #b5d67a; --accent-ground: #25321a;
  --good: #6dc7b0; --warn: #e8b65e; --bad: #ee8a7e;
  --c1: #b5d67a; --c2: #e8b65e; --c3: #8fb6e8; --c4: #6dc7b0; --c5: #e79bb0; --c6: #93a79f;
}
#dash-root, .mg {
  --sp1: 4px; --sp2: 8px; --sp3: 12px; --sp4: 16px; --sp5: 24px;
  --radius: 10px; --radius-inner: 6px;
  --fs-small: 12px; --fs-body: 14px; --fs-heading: 16px;
  --font: "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif;
  --font-num: "Segoe UI Variable Display", "Segoe UI", system-ui, sans-serif;
  color-scheme: dark;
}
#dash-root { background: var(--ground); color: var(--text); transition: background-color .2s ease-out; }
.mg, .mg * { box-sizing: border-box; }
.mg { display: grid; grid-template-columns: 208px minmax(0, 1fr); min-height: 700px; font: 400 var(--fs-body)/1.45 var(--font); color: var(--text); background: var(--ground); }
.mg h1, .mg h2, .mg h3, .mg p, .mg ul, .mg dl, .mg dd { margin: 0; }
.mg h2 { font-size: var(--fs-heading); font-weight: 600; }
.mg button { font: inherit; color: inherit; }
.mg [hidden] { display: none !important; }
.mg :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.mg-panel :focus-visible { outline-offset: -2px; }
.mg-muted { color: var(--muted); }
.mg-small { font-size: var(--fs-small); }
.mg-num { font-family: var(--font-num); font-variant-numeric: tabular-nums; }
.mg-sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* Rail: name, search, tabs, palette */
.mg-rail { display: flex; flex-direction: column; gap: var(--sp3); padding: var(--sp5) var(--sp3); border-right: 1px solid var(--line); min-height: 0; }
.mg-name { font-weight: 700; padding: 0 var(--sp3); }
.mg-search { width: 100%; padding: var(--sp2) var(--sp3); border: 1px solid var(--line); border-radius: var(--radius-inner); background: var(--panel); color: var(--text); font: inherit; }
.mg-search::placeholder, .mg-input::placeholder { color: var(--muted); }
.mg-tabs { display: flex; flex-direction: column; gap: 2px; }
.mg-tab { display: flex; align-items: center; gap: var(--sp2); background: none; border: 0; padding: var(--sp2) var(--sp3); border-radius: var(--radius-inner); color: var(--muted); cursor: pointer; white-space: nowrap; text-align: left; transition: background-color .12s ease-out, color .12s ease-out; }
.mg-tab:hover { color: var(--text); background: var(--panel-2); }
.mg-tab[aria-current="page"] { color: var(--accent); background: var(--accent-ground); font-weight: 600; }
.mg-count { margin-left: auto; font-size: var(--fs-small); font-variant-numeric: tabular-nums; color: var(--muted); }
.mg-count.mg-alert { color: var(--warn); }
.mg-palette { margin-top: auto; padding: 0 var(--sp3); display: flex; flex-direction: column; gap: var(--sp2); }
.mg-palette-pick { display: flex; gap: var(--sp2); }
.mg-palette-pick button { width: 28px; height: 28px; border-radius: 50%; border: 2px solid var(--line); cursor: pointer; padding: 0; background: linear-gradient(135deg, var(--a) 50%, var(--b) 50%); }
.mg-palette-pick button[aria-pressed="true"] { border-color: var(--text); }

/* Main area and pages */
.mg-main { display: flex; flex-direction: column; padding: var(--sp5); min-width: 0; min-height: 0; }
.mg-page { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: var(--sp4); }
.mg-head { display: flex; align-items: flex-end; justify-content: space-between; gap: var(--sp5); flex-wrap: wrap; }
.mg-head h1 { font-size: 24px; font-weight: 650; letter-spacing: -.01em; }
.mg-head h1 b { color: var(--accent); font-weight: inherit; }
.mg-sub { margin-top: var(--sp1); }
.mg-measures { display: flex; gap: var(--sp2); }
.mg-measure { display: flex; flex-direction: column; align-items: flex-start; min-width: 112px; padding: var(--sp2) var(--sp3); background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); cursor: pointer; text-align: left; transition: border-color .12s ease-out; }
.mg-measure:hover { border-color: var(--accent); }
.mg-measure > span { max-width: 100%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.mg-measure-v { font-size: 22px; font-weight: 600; line-height: 1.2; }
.mg-measure.mg-alert .mg-measure-v { color: var(--warn); }

/* Panel: fixed head, the body fills the rest and scrolls inside */
.mg-panel { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); display: flex; flex-direction: column; min-height: 0; min-width: 0; }
.mg-panel-head { display: flex; align-items: baseline; justify-content: space-between; gap: var(--sp3); padding: var(--sp4) var(--sp4) var(--sp3); }
.mg-extra { font-size: var(--fs-small); color: var(--muted); white-space: nowrap; }
.mg-extra[type="button"] { background: none; border: 0; padding: 0 var(--sp1); cursor: pointer; color: var(--accent); min-height: 24px; }
.mg-body { padding: 0 var(--sp4) var(--sp4); overflow: auto; min-height: 0; flex: 1; scrollbar-width: thin; scrollbar-color: var(--line) transparent; }
.mg-pill { display: inline-block; min-width: 24px; padding: 0 var(--sp2); border-radius: 999px; background: var(--accent-ground); color: var(--accent); font-size: var(--fs-small); text-align: center; font-weight: 600; }
.mg-empty { color: var(--muted); padding: var(--sp2) 0; }

.mg-badge { display: inline-flex; align-items: center; gap: 6px; font-size: var(--fs-small); color: var(--muted); white-space: nowrap; }
.mg-badge::before { content: ""; flex: none; width: 7px; height: 7px; border-radius: 50%; background: var(--dot, var(--c6)); }
.b-approval { --dot: var(--c1); } .b-decision { --dot: var(--c2); } .b-question { --dot: var(--c3); } .b-task { --dot: var(--c4); } .b-notice { --dot: var(--c5); }
.b-ok { --dot: var(--good); } .b-warn { --dot: var(--warn); } .b-bad { --dot: var(--bad); }
.mg-tag { display: inline-flex; align-items: center; gap: 5px; font-size: var(--fs-small); color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 160px; }
.mg-tag::before { content: ""; flex: none; width: 7px; height: 7px; border-radius: 2px; background: var(--tag, var(--c6)); }

.mg-list { list-style: none; padding: 0; }
.mg-row { padding: var(--sp3) 0; border-top: 1px solid var(--line); }
.mg-row:first-child { border-top: 0; padding-top: 0; }
.mg [role="button"] { cursor: pointer; }
.mg-row[role="button"]:hover p, .mg-table tr[role="button"]:hover td { color: var(--text); }
.mg-top { display: flex; align-items: center; gap: var(--sp3); margin-bottom: 2px; min-width: 0; }
.mg-top strong { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.mg-right { margin-left: auto; font-size: var(--fs-small); color: var(--muted); white-space: nowrap; }
.mg-code { font-size: var(--fs-small); color: var(--muted); font-variant-numeric: tabular-nums; }
.mg-two { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; max-width: 70ch; }
.mg-one { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
/* One-line item: at least three rows show in a short panel; the full text is in the drawer */
.mg .mg-oneline { display: flex; align-items: center; gap: var(--sp3); padding-top: var(--sp2); padding-bottom: var(--sp2); }
.mg-oneline > * { flex: none; }
.mg-oneline > .mg-one { flex: 1; min-width: 0; }
.mg-later { margin-top: var(--sp3); border-top: 1px solid var(--line); padding-top: var(--sp3); }
.mg-later summary { cursor: pointer; color: var(--muted); padding: var(--sp1) 0; }
.mg-later[open] summary { margin-bottom: var(--sp3); }

.mg-table { width: 100%; border-collapse: collapse; }
.mg-table th { position: sticky; top: 0; background: var(--panel); text-align: left; font-weight: 500; font-size: var(--fs-small); color: var(--muted); padding: 0 var(--sp3) var(--sp2) 0; border-bottom: 1px solid var(--line); }
.mg-table td { padding: var(--sp2) var(--sp3) var(--sp2) 0; border-bottom: 1px solid var(--line); vertical-align: top; }
.mg-table td:first-child { white-space: nowrap; font-weight: 600; }
.mg-table tr:last-child td { border-bottom: 0; }
.mg-table .mg-end { text-align: right; white-space: nowrap; padding-left: var(--sp4); }
.mg-table th:last-child, .mg-table td:last-child { padding-right: 0; }
.mg-team .mg-tag { font-size: var(--fs-body); font-weight: 600; }
.mg-narrow-only { display: none; }

.mg-council-card { padding: var(--sp2) var(--sp3); margin-bottom: var(--sp3); background: var(--panel-2); border-radius: var(--radius-inner); }
.mg-bars { display: flex; align-items: flex-end; gap: 3px; height: 44px; }
.mg-bars i { flex: 1; background: var(--accent); opacity: .4; border-radius: 2px 2px 0 0; min-height: 2px; }
.mg-bars i:nth-last-child(-n+7) { opacity: .9; }
.mg-bars-foot { display: flex; justify-content: space-between; margin: var(--sp1) 0 var(--sp3); }

/* Today grid: pending items on the left, two rows high; the project table and an even three on the right */
.mg-g-today { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(320px, 1fr) minmax(0, 2.2fr); gap: var(--sp4); }
.mg-today-right { display: grid; grid-template-rows: minmax(0, 1fr) minmax(0, 1fr); gap: var(--sp4); min-height: 0; }
.mg-three { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: var(--sp4); min-height: 0; }
.mg-searchpage .mg-panel { flex: 1; }

/* Flow: the chart on the left; the selection and recent records on the right */
.mg-views { display: flex; flex-wrap: wrap; gap: 2px; padding: var(--sp1); background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); }
.mg-view { background: none; border: 0; padding: var(--sp2) var(--sp3); border-radius: var(--radius-inner); color: var(--muted); cursor: pointer; transition: background-color .12s ease-out, color .12s ease-out; }
.mg-view:hover { color: var(--text); background: var(--panel-2); }
.mg-view[aria-pressed="true"] { color: var(--accent); background: var(--accent-ground); font-weight: 600; }
.mg-g-flow { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: var(--sp4); }
.mg-flow-right { display: grid; grid-template-rows: minmax(0, .85fr) minmax(0, 1.15fr); gap: var(--sp4); min-height: 0; }
.mg-chart { overflow: hidden; display: flex; }
.mg-canvas { position: relative; flex: 1; min-width: 0; min-height: 0; }
.mg-canvas > svg { position: absolute; inset: 0; display: block; }
.mg-canvas.mg-narrow { overflow: auto; }
.mg-band { fill: none; stroke-opacity: .5; cursor: pointer; transition: stroke-opacity .12s ease-out; }
.mg-band:hover { stroke-opacity: .8; }
.mg-band.mg-dim { stroke-opacity: .08; }
.mg-k0 { stroke: var(--c1); } .mg-k1 { stroke: var(--c2); } .mg-k2 { stroke: var(--c3); } .mg-k3 { stroke: var(--c4); } .mg-k4 { stroke: var(--c5); } .mg-k5 { stroke: var(--c6); }
.mg-node rect { fill: var(--text); }
.mg-node .mg-nl { fill: var(--text); font-size: 13px; font-weight: 600; }
.mg-node .mg-ns { fill: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
.mg-node.mg-dim { opacity: .45; }
.mg-node[aria-pressed="true"] .mg-nl, .mg-node:focus-visible .mg-nl { fill: var(--accent); }
.mg-node:focus-visible rect { stroke: var(--accent); stroke-width: 3; }
.mg-tip { position: absolute; z-index: 2; max-width: 280px; padding: var(--sp1) var(--sp2); background: var(--panel-2); border: 1px solid var(--line); border-radius: var(--radius-inner); font-size: var(--fs-small); pointer-events: none; }
.mg-flow-col { margin-bottom: var(--sp4); }
.mg-flow-col h3, .mg .mg-subhead { font-size: var(--fs-small); color: var(--muted); font-weight: 600; margin: var(--sp3) 0 var(--sp1); }
.mg-flow-col h3 { margin-top: 0; }
.mg .mg-pick-name { font-size: var(--fs-heading); font-weight: 600; margin-bottom: var(--sp1); overflow-wrap: anywhere; }
.mg-bar-row, .mg-link-row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: var(--sp1) var(--sp3); width: 100%; background: none; border: 0; border-top: 1px solid var(--line); padding: var(--sp2) 0; text-align: left; cursor: pointer; min-height: 32px; }
.mg-bar-row span, .mg-link-row span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.mg-bar-row b, .mg-link-row b { font-weight: 500; color: var(--muted); }
.mg-bar-row i { grid-column: 1 / -1; height: 4px; border-radius: 2px; background: var(--accent); opacity: .7; }
.mg-bar-row[aria-pressed="true"] span, .mg-link-row:hover span, .mg-bar-row:hover span { color: var(--accent); }

/* Pickable list, paging, filters */
.mg-pickable > .mg-row { padding-left: var(--sp2); padding-right: var(--sp2); border-radius: var(--radius-inner); }
.mg-pickable > .mg-row:first-child { padding-top: var(--sp3); }
.mg-pickable > .mg-row[aria-pressed="true"] { background: var(--accent-ground); }
.mg-pickable > .mg-row[aria-pressed="true"] strong, .mg-pickable > .mg-row[aria-pressed="true"] .mg-tag { color: var(--accent); }
.mg-pager { display: flex; align-items: center; justify-content: center; gap: var(--sp3); padding-top: var(--sp3); border-top: 1px solid var(--line); }
.mg-pager button { min-width: 32px; min-height: 28px; background: var(--panel-2); border: 1px solid var(--line); border-radius: var(--radius-inner); cursor: pointer; }
.mg-pager button:disabled { color: var(--muted); background: none; cursor: default; }
.mg-filtered { flex-wrap: wrap; align-items: center; }
.mg-filtered h2 { flex: 1; }
.mg-input { background: var(--panel-2); color: var(--text); border: 1px solid var(--line); border-radius: var(--radius-inner); padding: var(--sp1) var(--sp2); font: inherit; font-size: var(--fs-small); min-height: 28px; max-width: 160px; }

/* Projects: list on the left; the selected project and recent progress on the right; strip and releases below */
.mg-g-projects { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(260px, 1fr) minmax(0, 2.6fr); grid-template-rows: minmax(0, 1fr) minmax(0, 1fr) minmax(0, 1.1fr); gap: var(--sp4); }
.mg-pr-list { grid-row: 1 / 3; }
.mg-pr-bottom { grid-column: 1 / -1; display: grid; grid-template-columns: minmax(0, 2fr) minmax(0, 1fr); gap: var(--sp4); min-height: 0; }
.mg-pr-picked { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: var(--sp5); overflow: hidden; }
.mg-pr-picked > div { min-height: 0; overflow: auto; scrollbar-width: thin; }
.mg .mg-pr-picked .mg-subhead { margin-top: 0; }
.mg-strip-row .mg-nl { fill: var(--muted); font-size: 12px; }
.mg-strip-row rect { fill: var(--accent); opacity: .5; }
.mg-strip-row.mg-on .mg-nl { fill: var(--accent); font-weight: 600; }
.mg-strip-row.mg-on rect { opacity: 1; }
.mg-grid-line { stroke: var(--line); }
.mg-axis { fill: var(--muted); font-size: 11px; }
.mg-rhythm { position: relative; height: 12px; border-bottom: 1px solid var(--line); margin: 0 var(--sp2) var(--sp3); }
.mg-rhythm i { position: absolute; bottom: -5px; width: 9px; height: 9px; margin-left: -4px; border-radius: 50%; background: var(--panel); border: 2px solid var(--muted); }
.mg-rhythm i.mg-on { background: var(--accent); border-color: var(--accent); }

/* Agents and councils: the team on the left; councils and the filtered log on the right */
/* The councils panel takes the room of its content (at most 40%, the rest scrolls inside); the log fills the rest */
.mg-g-agents { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(300px, 1fr) minmax(0, 2fr); grid-template-rows: fit-content(40%) minmax(0, 1fr); gap: var(--sp4); }
.mg-council-table td:nth-child(2) { max-width: 0; width: 45%; }
.mg-team { grid-row: 1 / 3; }

/* Knowledge: filter and breakdown on the left, paged list on the right; Discoveries are three even panels */
.mg-g-knowledge { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(280px, 1fr) minmax(0, 2.6fr); gap: var(--sp4); }
.mg-kn-left { display: grid; grid-template-rows: fit-content(55%) minmax(0, 1fr); gap: var(--sp4); min-height: 0; }
.mg-g-discover { flex: 1; min-height: 0; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: var(--sp4); }
.mg-form { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: var(--sp2) var(--sp3); align-items: center; }
.mg-form label { font-size: var(--fs-small); color: var(--muted); }
.mg-form .mg-input { max-width: none; width: 100%; }
.mg-presets { display: flex; flex-wrap: wrap; gap: var(--sp2); padding: 0 var(--sp4) var(--sp3); }
.mg-presets button { background: var(--panel-2); border: 1px solid var(--line); border-radius: 999px; padding: var(--sp1) var(--sp3); cursor: pointer; font-size: var(--fs-small); min-height: 28px; }
.mg-presets button:hover { color: var(--accent); }
.mg-view .mg-count { margin-left: var(--sp2); }

/* Log: activity bars on top, a full-height list below */
.mg-g-log { flex: 1; min-height: 0; display: grid; grid-template-rows: 168px minmax(0, 1fr); gap: var(--sp4); }
.mg-activity { height: 100%; display: flex; flex-direction: column; }
.mg-stack-bars { flex: 1; min-height: 40px; display: flex; align-items: flex-end; gap: 2px; }
.mg-stack-bars > span { flex: 1; height: 100%; display: flex; align-items: flex-end; gap: 1px; }
.mg-stack-bars i { flex: 1; border-radius: 2px 2px 0 0; min-height: 1px; }
.mg-stack-bars .mg-sa, .mg-legend .mg-sa { background: var(--c1); }
.mg-stack-bars .mg-sb, .mg-legend .mg-sb { background: var(--c2); }
.mg-legend { display: inline-flex; align-items: center; gap: var(--sp1); margin-left: var(--sp3); }
.mg-legend i { width: 8px; height: 8px; border-radius: 2px; }
.mg .mg-input-search { width: 160px; }

/* System: inner tabs; Status has a measure strip and 3x2 panels, the others two or three columns */
.mg-sys-area { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: var(--sp4); }
.mg-sys-measures { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: var(--sp2); }
.mg-sys-measures .mg-measure { min-width: 0; }
.mg-measure.mg-static { cursor: default; }
.mg-measure.mg-static:hover { border-color: var(--line); }
.mg-g-status, .mg-g-rules, .mg-g-skills, .mg-g-cost, .mg-g-analysis { flex: 1; min-height: 0; display: grid; gap: var(--sp4); }
.mg-g-status { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr) minmax(0, 1.3fr); grid-template-rows: repeat(2, minmax(0, 1fr)); }
.mg-g-rules { grid-template-columns: minmax(240px, .9fr) minmax(0, 2fr) minmax(0, 1.5fr); }
.mg-g-skills { grid-template-columns: minmax(0, 1.6fr) minmax(0, 1fr); }
.mg-skills-right { display: grid; grid-template-rows: minmax(0, 1fr) minmax(0, 1fr); gap: var(--sp4); min-height: 0; }
.mg-g-cost { grid-template-columns: minmax(0, 1.3fr) minmax(0, 1fr); grid-template-rows: minmax(0, 1fr) minmax(0, 1.2fr); }
.mg-g-cost > .mg-panel:first-child { grid-column: 1 / -1; }
.mg-g-analysis { grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr) minmax(0, 1fr); grid-template-rows: repeat(2, minmax(0, 1fr)); }
.mg-wide { grid-column: span 2; }
.mg-an-top { display: flex; flex-wrap: wrap; align-items: center; gap: var(--sp3); }
.mg-an-top .mg-sys-measures { flex: 1; min-width: 280px; }
.mg-an-top .mg-sys-measures, #mg-co-measures { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.mg-bar-row.mg-static { cursor: default; }
#mg-ru-name { white-space: nowrap; }
.mg-shrink-name td:first-child { max-width: 0; width: 70%; overflow: hidden; text-overflow: ellipsis; font-weight: 500; }
.mg-ratio { height: 4px; margin-top: var(--sp1); border-radius: 2px; background: var(--panel-2); }
.mg-ratio i { display: block; height: 100%; border-radius: 2px; background: var(--good); }

  /* ---------- Constants ---------- */
  const DEFAULT_LANGUAGE = 'en';
  const PALETTES = [['ink', '#0b1020', '#8ab4f0'], ['graphite', '#161412', '#d9925f'], ['pine', '#091612', '#b5d67a']];

  const DATASETS = ['meta', 'notes', 'log', 'versions', 'links', 'tasks', 'counts', 'progress', 'weekly', 'pending', 'agents', 'agent_runs',

  const BUILD_DELAY_MS = 120;
  const SEARCH_DELAY_MS = 200;
  const MIN_HEIGHT = 700;

  // A project home page is <projects folder>/<p>/<p>.md; the folder name itself may be in the install language
  const PROJECT_PATH = /^[^/]+\/([^/]+)\/\1\.md$/;
  // Free text is the user's own words, in either install language; the /i flag does not match the Turkish capital İ to i
  const freeText = (s) => String(s ?? '').trim().replace(/İ/g, 'i');
  const NEXT = (e) => /sıradaki|sonraki|next|plan/i.test(freeText(e));
  const NEXT_LABEL = (e) => /^\s*(sıradaki|sonraki|next)/i.test(freeText(e));
  const LEARNED = (e) => /öğrenil|ders|tuzak|learn|lesson|pitfall/i.test(freeText(e));
  const DECISION = (e) => /karar|decision/i.test(freeText(e));
  const KIND_BADGE = { question: 'b-question', approval: 'b-approval', decision: 'b-decision', task: 'b-task', notice: 'b-notice' };
  const HEALTH_ORDER = { error: 0, warning: 1, info: 2, ok: 3 };
  const HEALTH_BADGE = { error: 'b-bad', warning: 'b-warn', info: 'b-question', ok: 'b-ok' };

  /* ---------- Helpers ---------- */
  const $ = (s) => document.querySelector(s);
  const el = (tag, cls, text) => { const x = document.createElement(tag); if (cls) x.className = cls; if (text != null) x.textContent = text; return x; };
  let lang = DEFAULT_LANGUAGE;
  let T = STRINGS[lang];
  const pick = (map, key) => (map && Object.hasOwn(map, String(key)) ? map[key] : undefined);
  const lookup = (path) => path.split('.').reduce((node, part) => pick(node, part), T);
  // {n} is the value; {n|one|other} and a "one|other" unit word pick the singular when the value reads exactly "1"
  const isOne = (value) => String(value) === '1';
  const countWord = (word, value) => { const [one, other = one] = String(word).split('|'); return isOne(value) ? one : other; };
  const fmt = (template, values) => String(template).replace(/\{(\w+)(?:\|([^|{}]*)\|([^|{}]*))?\}/g, (all, k, one, other) => {
    if (!values || !Object.hasOwn(values, k)) return all;
    return one === undefined ? values[k] : isOne(values[k]) ? one : other;
  });
  const lbl = (group, value) => pick(T[group], value ?? '') ?? String(value ?? '');
  const none = (key) => pick(T.none, key) ?? T.empty;
  let numberFormat; let longDate; let shortDate; let dollarFormat; let exactDollar;
  function setFormats() {
    numberFormat = new Intl.NumberFormat(lang);
    longDate = new Intl.DateTimeFormat(lang, { day: 'numeric', month: 'long', year: 'numeric', timeZone: 'UTC' });
    shortDate = new Intl.DateTimeFormat(lang, { day: 'numeric', month: 'short', timeZone: 'UTC' });
    dollarFormat = new Intl.NumberFormat(lang, { maximumFractionDigits: 0 });

  }
  const num = (n) => numberFormat.format(Number(n) || 0);
  const lower = (s) => String(s ?? '').toLocaleLowerCase(lang);
  const capitalize = (s) => String(s).replace(/^./, (h) => h.toLocaleUpperCase(lang));
  // Display text: the secret-scan marker in the page language, wiki links and bold marks as plain words
  const show = (s) => { const t = s == null ? '' : String(s); return t.includes(HIDDEN_TEXT) ? t.split(HIDDEN_TEXT).join(T.hidden) : t; };
  const plain = (s) => show(s).replace(/\[\[([^\]|]+)\|([^\]]+)\]\]/g, '$2').replace(/\[\[([^\]]+)\]\]/g, '$1').replace(/\*\*/g, '');
  const readDate = (s) => new Date(String(s).slice(0, 10) + 'T00:00:00Z');
  const dateText = (s) => { const d = readDate(s); return !s || isNaN(d) ? '—' : longDate.format(d); };
  const short = (d) => shortDate.format(d);
  // "Today/yesterday" follows the local calendar (after midnight UTC still showed the day before)
  const todayUtc = () => { const s = new Date(); return Date.UTC(s.getFullYear(), s.getMonth(), s.getDate()); };
  const DAY_MS = 86400000;
  const daysAgo = (s) => { const d = readDate(s); return isNaN(d) ? UNKNOWN_DAYS : Math.round((todayUtc() - d.getTime()) / DAY_MS); };
  const age = (s) => { const g = daysAgo(s); return g === UNKNOWN_DAYS ? '—' : g <= 0 ? T.today : g === 1 ? T.yesterday : fmt(T.nDays, { n: g }); };
  const relative = (s) => { const g = daysAgo(s); return g === UNKNOWN_DAYS ? '—' : g <= 0 ? T.today : g === 1 ? T.yesterday : g < 30 ? fmt(T.nDaysAgo, { n: g }) : dateText(s); };
  const pct = (part, whole) => fmt(T.pct, { n: whole ? Math.round((part / whole) * 100) : 0 });
  const state = (id) => { const d = dash.data(id); return (d && d.status) || 'missing'; };
  const rows = (id) => { const d = dash.data(id); return d && d.status === 'ok' && Array.isArray(d.data) ? d.data.filter((r) => r && r._placeholder !== true) : []; };
  const safeUrl = (s) => (/^https?:\/\//i.test(String(s || '').trim()) ? String(s).trim() : '');
  const STATE_TEXT = () => ({ loading: T.loading, error: T.loadError });

  // A data set that has not arrived writes its state into the box; nothing is computed on an empty list (RangeError lesson)
  function ready(box, ids) {
    const status = ids.map(state).find((s) => s !== 'ok');
    if (!status) return true;
    box.replaceChildren(el('p', 'mg-empty', STATE_TEXT()[status] || T.missing));
    return false;
  }
  function clickable(x, action) {

    return x;
  }
  const badge = (text, cls) => el('span', 'mg-badge ' + (cls || ''), text);
  const keyed = (x, key) => { x.dataset.key = String(key ?? ''); return x; };
  const rowItem = (r, cls) => keyed(el('li', cls || 'mg-row'), r.key);
  const emptyItem = (text) => el('li', 'mg-empty', text);
  const textItem = (r, text) => { const li = rowItem(r); li.textContent = text; return li; };

  /* ---------- Notes, projects, colors ---------- */
  let noteIndex = new Map();
  let progressNotes = new Map();
  let agentDisplay = new Map();
  const findNote = (id) => noteIndex.get(id);
  function indexNotes() {
    noteIndex = new Map(); progressNotes = new Map();
    rows('notes').forEach((n) => {
      const old = noteIndex.get(n.id); if (!old || String(old.path).startsWith('.claude/')) noteIndex.set(n.id, n);
      if (n.type === 'progress' && n.project && !progressNotes.has(n.project)) progressNotes.set(n.project, n.id);
    });
    agentDisplay = new Map(rows('agents').map((a) => [a.name, plain(a.display || '')]).filter(([, d]) => d));
  }
  const shortName = (title) => String(title || '').split(' — ')[0];
  const projectName = (id) => shortName((findNote(id) || {}).title) || id;
  const isProjectHome = (n) => n.type === 'project' && n.folder === 'projects' && PROJECT_PATH.test(n.path);
  const projectPages = () => rows('notes').filter(isProjectHome);
  const readable = (s) => agentDisplay.get(s) || capitalize(s);
  const projectLabel = (p) => { const id = String(p || '').replace(/\[\[|\]\]/g, ''); return id ? (shortName((findNote(id) || {}).title) || capitalize(id)) : T.vaultAndSystem; };

  // Every chat and project name keeps one color: a name hash picks a palette slot, a taken slot moves to the next free one
  let colorMap = new Map();
  const hash = (s) => { let h = 0; for (const c of String(s)) h = (h * 31 + c.codePointAt(0)) >>> 0; return h; };
  function assignColors(list) {
    const keys = [...new Set(list.flatMap((r) => [r.chat && 's:' + r.chat, r.project && 'p:' + r.project]).filter(Boolean))].sort((a, b) => a.localeCompare(b, lang));
    const taken = new Set(); colorMap = new Map();
    keys.forEach((k) => { let i = hash(k) % COLORS.length; for (let n = 0; n < COLORS.length && taken.has(i); n++) i = (i + 1) % COLORS.length; taken.add(i); colorMap.set(k, COLORS[i]); });
  }

    const color = colorMap.get(kind + ':' + name); if (color) x.style.setProperty('--tag', color);
    x.title = kind === 's' ? T.chat : T.project;
    return x;
  }

  /* ---------- Palette (the choice lasts for this visit only) ---------- */
  function applyPalette(name) {
    [document.getElementById('dash-root'), $('#mg')].forEach((x) => { if (x) x.dataset.palette = name; });

  }
  function setupPalette(requested) {
    const box = $('#mg-palette');

      d.style.setProperty('--a', a); d.style.setProperty('--b', b);
      d.addEventListener('click', () => applyPalette(name));

    applyPalette(PALETTES.some(([name]) => name === requested) ? requested : PALETTES[0][0]);
  }

  /* ---------- Tabs (only the open tab is built) ---------- */
  let openTabId = 'today';
  let toBuild = new Set();
  const TAB_BUILD = { today: () => buildToday(), flow: () => buildFlow(), projects: () => buildProjects(), agents: () => buildAgents(), knowledge: () => buildKnowledge(), system: () => buildSystem(), log: () => buildLog() };
  function setupTabs() {
    const box = $('#mg-tabs');
    TABS.forEach((id) => {
      const b = el('button', 'mg-tab'); b.type = 'button'; b.dataset.tab = id;
      b.append(el('span'), el('span', 'mg-count'));
      b.addEventListener('click', () => openTab(id));

  }
  const pageOf = (id) => `#mg-p-${id}`;

  }

  }

  function tabCount(id, n, alert) {

  const openPending = () => rows('pending').filter((b) => b.status === 'open');
  const healthRows = () => rows('health').sort((a, b) => (HEALTH_ORDER[a.status] ?? 9) - (HEALTH_ORDER[b.status] ?? 9) || a.order - b.order);

  /* ---------- Drawer (the one detail view) ---------- */
  let drawerOpener = null;

    const body = $('#mg-d-body'); body.replaceChildren(...parts.filter(Boolean)); body.scrollTop = 0;

        [D.path, n.path], [D.length, fmt(D.words, { n: num(n.words) })]]),

  /* ---------- Today ---------- */
  function buildToday() { writeTitle(); writeMeasures(); writePending(); writeNextSteps(); writeHandoff(); writeTodayAgents(); writeTodaySystem(); }

  function writeTitle() {
    const h1 = $('#mg-t-title'); const sub = $('#mg-t-sub'); const D = T.td;
    if (state('pending') !== 'ok') { h1.textContent = STATE_TEXT()[state('pending')] || T.missing; sub.textContent = ''; return; }
    const open = openPending();
    h1.replaceChildren();
    if (open.length) { const [before, after] = D.waiting.split('{n}'); h1.append(before, el('b', 'mg-num', num(open.length)), after ?? ''); } else h1.textContent = D.nothingWaiting;
    const oldest = open.reduce((m, b) => (!m || String(b.date) < m ? String(b.date) : m), '');
    const held = rows('pending').filter((b) => b.status === 'held').length;
    const parts = [oldest ? fmt(D.oldest, { when: relative(oldest) }) : '', held ? fmt(D.held, { n: num(held) }) : ''];
    if (state('health') === 'ok') parts.push(fmt(D.warnings, { n: num(healthIssues().length) }));
    sub.textContent = parts.filter(Boolean).join(' · ');
  }

  // A measure without a target only informs: it is not a button and is not clicked
  function measure(name, value, subText, target, alert) {
    const b = el(target ? 'button' : 'div', 'mg-measure' + (alert ? ' mg-alert' : '') + (target ? '' : ' mg-static'));

  }
  function writeMeasures() {
    const ok = (id) => state(id) === 'ok'; const no = '—'; const M = T.m;

    const tasks = rows('tasks'); const openTasks = tasks.filter((g) => Number(g.done) === 0).length;
    const notes = rows('notes'); const problems = openProblems().length;
    const latest = rows('versions').sort((a, b) => String(b.date).localeCompare(String(a.date)))[0];

    $('#mg-t-measures').replaceChildren(

  const flowState = { view: 'work', pick: null, drawSig: '' };
  let flowCache = new Map();

  function computeFlow(view) {
    if (flowCache.has(view)) return flowCache.get(view);
    const def = FLOW[view]; const weight = def.weight || (() => 1);
    const records = rows(def.data).map((r) => ({ r, names: def.path.map((f) => f(r)), w: weight(r) }));
    // At most 6 groups per column; the rest collect in "Other", the total stays the same
    const grouper = (i) => {
      const total = new Map(); records.forEach((k) => total.set(k.names[i], (total.get(k.names[i]) || 0) + k.w));
      const sorted = [...total.entries()].sort((x, y) => y[1] - x[1]);
      const kept = new Set(sorted.slice(0, FLOW_MAX).map(([name]) => name));
      return sorted.length > FLOW_MAX + 1 ? (name) => (kept.has(name) ? name : OTHER) : (name) => name;
    };
    const groups = def.path.map((_, i) => grouper(i));
    const nodes = new Map(); const bands = new Map();
    records.forEach((k) => {
      const names = k.names.map((name, i) => groups[i](name));
      names.forEach((name, i) => {
        const nk = `${i}|${name}`;
        const d = nodes.get(nk) || { k: nk, name: name === OTHER ? T.other : name, other: name === OTHER, col: i, value: 0, records: [] };
        d.value += k.w; d.records.push(k.r); nodes.set(nk, d);
        if (i === names.length - 1) return;
        const bk = `${nk}>${i + 1}|${names[i + 1]}`;
        const b = bands.get(bk) || { k: bk, source: nk, target: `${i + 1}|${names[i + 1]}`, value: 0, records: [] };
        b.value += k.w; b.records.push(k.r); bands.set(bk, b);
      });
    });
    const flow = { def, view, nodes: [...nodes.values()], bands: [...bands.values()], total: records.reduce((t, k) => t + k.w, 0) };
    flow.find = new Map([...flow.nodes, ...flow.bands].map((x) => [x.k, x]));

  }
  const formatOf = (flow) => flow.def.format || num;

  // Not redrawn while the width, height, view, selection and data stay the same
  function drawFlow() {

    const W = canvas.clientWidth; const narrow = W < FLOW_NARROW;

  function layoutFlow(flow, H, W) {
    const GAP = 14; const THICK = 14;
    const colCount = flow.def.path.length;
    const edge = Math.min(150, W * 0.2);
    const xAt = (s) => edge + (s * (W - 2 * edge - THICK)) / (colCount - 1);
    const cols = flow.def.path.map((_, s) => flow.nodes.filter((d) => d.col === s).sort(byOtherThenValue));
    const scale = cols.reduce((m, c) => Math.min(m, (H - GAP * (c.length - 1)) / flow.total), Infinity);
    cols.forEach((c) => {
      let y = (H - (c.reduce((t, d) => t + d.value * scale, 0) + GAP * (c.length - 1))) / 2;
      c.forEach((d) => { d.x = xAt(d.col); d.y = y; d.h = Math.max(d.value * scale, 2); d.out = y; d.in = y; y += d.h + GAP; });
    });
    // Every group of the first column carries its own color; "Other" is always the muted one
    const color = new Map(cols[0].map((d, i) => [d.k, d.other ? FLOW_COLOR_COUNT - 1 : i % (FLOW_COLOR_COUNT - 1)]));

  }
  // Labels do not overlap or run below the chart: column by column they are pushed down, then up
  function labelPositions(nodes, H) {
    const GAP = 32; const TOP = 14; const BOTTOM = 18; const at = new Map();
    [...new Set(nodes.map((d) => d.col))].forEach((s) => {
      const sorted = nodes.filter((d) => d.col === s).sort((a, b) => a.y - b.y);
      const y = sorted.map((d) => Math.max(TOP, d.y + d.h / 2 - 1));
      for (let i = 1; i < y.length; i++) y[i] = Math.max(y[i], y[i - 1] + GAP);
      y[y.length - 1] = Math.min(y[y.length - 1], H - BOTTOM);
      for (let i = y.length - 2; i >= 0; i--) y[i] = Math.min(y[i], y[i + 1] - GAP);
      sorted.forEach((d, i) => at.set(d.k, y[i]));
    });
    return at;
  }
  const svgEl = (name, attrs = {}) => { const e = document.createElementNS(NS, name); Object.entries(attrs).forEach(([k, v]) => e.setAttribute(k, v)); return e; };
  const svgText = (attrs, text) => { const e = svgEl('text', attrs); e.textContent = text; return e; };

  function flowSvg(canvas, flow, W, H) {
    const f = formatOf(flow); const picked = flowState.pick; const sel = picked && flow.find.get(picked); const text = flowText(flow.view);
    const related = (x) => !sel || x.k === picked || (sel.source ? x.k === sel.source || x.k === sel.target : x.source === picked || x.target === picked);
    const { scale, color, THICK } = layoutFlow(flow, H, W);
    const svg = svgEl('svg', { viewBox: `0 0 ${W} ${H}`, width: W, height: H, role: 'group', 'aria-label': fmt(T.fl.chartLabel, { name: text.name, n: f(flow.total) }), 'data-total': flow.total });
    [...flow.bands].sort((a, b) => flow.find.get(a.source).y - flow.find.get(b.source).y || flow.find.get(a.target).y - flow.find.get(b.target).y).forEach((b) => {

      a.out += k; c.in += k;

  // Projects over time: one row per project, one bar per day's record count

    const counts = new Map(); const ids = new Map();

    const rowCount = Math.max(1, Math.min(STRIP_MAX, Math.floor((H - STRIP_TOP) / STRIP_ROW_MIN)));

    $('#mg-pr-strip-x').title = P.stripTitle;

    const svg = svgEl('svg', { viewBox: `0 0 ${W} ${H}`, width: W, height: H, role: 'img', 'aria-label': fmt(P.stripLabel, { d: dayCount }) });

  /* ---------- Agents and councils ---------- */
  const AGENT_COLOR = { red: '#e5484d', cyan: '#2fa6b8', green: '#3fa37a', blue: '#5b8def', purple: '#b565c9', orange: '#d97757', yellow: '#d4a72c', pink: '#e0607e' };

  function writeAgentLog() {

      !all.length ? T.empty : pickedAgent ? fmt(T.ag.noneFor, { name: plain(agentName(pickedAgent)) }) : none('filterRecords'));
  }

  /* ---------- Shared: options, counting, breakdown bars ---------- */
  const unique = (list) => [...new Set(list.filter(Boolean))].sort((a, b) => String(a).localeCompare(String(b), lang));
  const tagsOf = (n) => String(n.tags || '').split(',').map((x) => x.trim()).filter(Boolean);
  const tally = (list) => { const m = new Map(); list.filter(Boolean).forEach((x) => m.set(x, (m.get(x) || 0) + 1)); return [...m.entries()].sort((a, b) => b[1] - a[1] || String(a[0]).localeCompare(String(b[0]), lang)); };
  function fillOptions(sel, options, fixedCount = 1) {
    const current = sel.value; const fixed = [...sel.options].slice(0, fixedCount);
    sel.replaceChildren(...fixed, ...options.map(([value, name]) => new Option(name, value)));
    sel.value = [...sel.options].some((o) => o.value === current) ? current : '';
  }
  function setFixedOptions(sel, pairs) {
    const current = sel.value;

  }
  // Breakdown: one bar per value; a click filters to that value, a second click lifts the filter
  function breakdown(box, groups, filter, refresh) {
    const parts = [];
    groups.forEach(({ title, field, counts, name }) => {
      if (!counts.length) return;
      parts.push(el('h3', 'mg-subhead', title));
      const most = counts.reduce((m, [, n]) => Math.max(m, n), 1);
      counts.forEach(([value, n]) => {
        const b = keyed(el('button', 'mg-bar-row'), `${field}:${value}`); b.type = 'button'; b.setAttribute('aria-pressed', String(filter[field] === value));
        const bar = el('i'); bar.style.width = `${Math.max(2, (n / most) * 100)}%`;
        b.append(el('span', '', name ? name(value) : plain(value)), el('b', 'mg-num', num(n)), bar);
        b.addEventListener('click', () => { filter[field] = filter[field] === value ? '' : value; refresh(); });
        parts.push(b);
      });
    });
    if (!parts.length) parts.push(el('p', 'mg-empty', none('noBreakdown')));
    box.replaceChildren(...parts);
  }

  /* ---------- Knowledge: Notes, Learned, Problems, Discoveries ---------- */
  const KN_PAGE = 25;
  const BREAKDOWN_LIMIT = 12;
  const CONCEPT_TYPE = '__concept';
  const NOTE_SORTS = ['updated', 'created', 'links_in', 'title'];
  const PROBLEM_ORDER = { open: 0, solved: 1 };
  const PROBLEM_BADGE = { open: 'b-warn', solved: 'b-ok' };
  const DISCOVERY_STATUS = [[/^(proposed|öneri)$/i, 'proposed', 'b-approval'], [/^(liked later|sonra beğenildi)$/i, 'likedLater', 'b-ok'], [/^(liked|beğenildi)$/i, 'liked', 'b-ok'],
    [/^(became a project|projeye döndü)$/i, 'project', 'b-ok'], [/^(rejected|reddedildi)$/i, 'rejected', ''], [/^(not chosen|seçilmedi)$/i, 'notChosen', '']];
  const RATINGS = ['very_high', 'high', 'medium', 'low'];
  const KN_DEFAULT = { notes: { sort: 'updated' }, learned: {}, problems: {} };
  const KN_LINK_PREFIX = 'knowledge-';
  const KN_SUBS = ['notes', 'learned', 'problems', 'discoveries'];
  let knSub = 'notes';
  const knFilter = { notes: { ...KN_DEFAULT.notes }, learned: {}, problems: {} };
  let knSearchTimer = 0;
  const learned = () => rows('progress').filter((r) => LEARNED(r.label));
  const problemNotes = () => rows('notes').filter((n) => n.type === 'problem');
  const projectOptions = (ids) => unique(ids).map((id) => [id, projectLabel(id)]);
  const discoveryStatus = (s) => { const t = String(s || '').trim(); const m = DISCOVERY_STATUS.find(([re]) => re.test(t)); return m ? [m[2], lbl('discStatus', m[1])] : ['', t || '—']; };
  const ratingName = (r) => lbl('ratings', r);

  function noteRows(s) {
    const q = lower(s.q || '');
    const list = rows('notes').filter((n) => (!s.type || (s.type === CONCEPT_TYPE ? n.type === 'concept' || n.type === 'source' : n.type === s.type)) && (!s.status || n.status === s.status)
      && (!s.project || n.project === s.project || n.id === s.project) && (!s.chat || n.chat === s.chat || n.chat_last === s.chat) && (!s.tag || tagsOf(n).includes(s.tag))
      && (s.sort !== 'links_in' || n.type !== 'entry')
      && (!q || lower([n.title, lbl('types', n.type), n.tags, n.aliases, n.summary, n.detail, n.project, n.chat, n.chat_last].join(' ')).includes(q)));
    const sort = s.sort || 'updated';
    return list.sort((a, b) => (sort === 'title' ? String(a.title).localeCompare(String(b.title), lang) : sort === 'links_in' ? Number(b.links_in) - Number(a.links_in) : String(b[sort]).localeCompare(String(a[sort]))));
  }
  function noteListRow(n) {
    const li = rowItem(n); const top = el('div', 'mg-top');
    top.append(el('strong', '', plain(n.title)), badge(lbl('types', n.type)), el('span', 'mg-right', knFilter.notes.sort === 'links_in' ? fmt(T.kn.linksN, { n: num(n.links_in) }) : relative(n.updated)));
    li.append(top, el('p', 'mg-two mg-muted', plain(n.summary)));
    return clickable(li, () => noteDrawer(n.id));
  }
  function learnedRows(s) {
    const q = lower(s.q || '');
    return learned().filter((r) => (!s.project || r.project === s.project) && (!s.tag || shortLabel(r.label) === s.tag) && (!q || lower([r.text, r.label, r.title].join(' ')).includes(q)))
      .sort((a, b) => String(b.date).localeCompare(String(a.date)) || b.order - a.order);
  }
  function learnedRow(r) {
    const li = rowItem(r); const top = el('div', 'mg-top');

  }
  function problemRows(s) {

  }
  function problemRow(n) {
    const li = rowItem(n); const top = el('div', 'mg-top');

  const typeName = (v) => lbl('types', v);
  const statusName = (v) => lbl('status', v);
  const KN = {
    notes: { data: ['notes'], source: 'notes', rows: noteRows, draw: noteListRow, total: () => rows('notes').length,
      fields: () => { const n = rows('notes'); const F = T.kn.f; return [['q', F.q], ['type', F.type, [[CONCEPT_TYPE, T.kn.conceptSource], ...unique(n.map((x) => x.type)).map((v) => [v, typeName(v)])]],
        ['status', F.status, unique(n.map((x) => x.status)).map((v) => [v, statusName(v)])], ['project', F.project, projectPages().map((p) => [p.id, shortName(plain(p.title))])],
        ['chat', F.chat, unique(n.flatMap((x) => [x.chat, x.chat_last])).map((v) => [v, v])], ['tag', F.tag, tally(n.flatMap(tagsOf)).map(([t, c]) => [t, `${t} (${c})`])],
        ['sort', F.sort, NOTE_SORTS.map((k) => [k, T.kn.sorts[k]]), true]]; },

      breakdown: () => { const B = T.kn.by; return [{ title: B.project, field: 'project', counts: tally(learned().map((r) => r.project)), name: projectLabel },

        { title: B.tag, field: 'tag', counts: tally(problemNotes().flatMap(tagsOf)).slice(0, BREAKDOWN_LIMIT) },

    discoveries: { data: ['discoveries'] },

  const discoveries = (kind) => rows('discoveries').filter((r) => r.kind === kind);

  function buildKnowledge() {
    const box = $('#mg-kn-subs');
    if (!box.childElementCount) {
      KN_SUBS.forEach((k) => {
        const b = el('button', 'mg-view'); b.type = 'button'; b.dataset.sub = k; b.append(el('span'), el('span', 'mg-count'));
        b.addEventListener('click', () => { knSub = k; if (typeof dash.setLink === 'function') dash.setLink(`${KN_LINK_PREFIX}${k}`); showKnowledge(); });

      });

      $('#mg-ds-rating').addEventListener('change', writeTrending);
    }
    // Every inner tab shows its total; Problems also shows the open count, in the warning color
    const problems = problemNotes();
    const counts = { notes: [rows('notes').length], learned: [learned().length], problems: [problems.length, problems.filter((n) => n.status === 'open').length], discoveries: [rows('discoveries').length] };
    box.querySelectorAll('button').forEach((b) => {
      const [n, open] = counts[b.dataset.sub]; b.firstChild.textContent = T.kn.subs[b.dataset.sub];

  function showKnowledge() {

    $('#mg-kn-list-name').textContent = T.kn.subs[knSub];
    $('#mg-kn-list').dataset.source = def.source; $('#mg-kn-breakdown').dataset.source = def.source;

    buildKnFilter(); writeKnList();

  function buildKnFilter() {
    const def = KN[knSub]; const s = knFilter[knSub]; const form = el('div', 'mg-form');
    def.fields().forEach(([key, name, options, noAll]) => {
      const id = `mg-kn-${key}`; const label = el('label', '', name); label.htmlFor = id;

      } else {
        input = el('select', 'mg-input');
        if (!noAll) input.append(new Option(T.all, ''));
        options.forEach(([value, text]) => input.append(new Option(text, value)));
        input.value = s[key] || (noAll ? options[0][0] : '');

  function writeKnList() {

    paged($('#mg-kn-list'), list, def.draw, KN_PAGE, total ? none('filterRecords') : T.empty);

  }

  function discoveryRow(r, [cls, text], body, drawer) {

      [[D.whatFor, r.goal], [D.yourWords, r.words], [D.why, r.reason], [D.instead, r.instead]])); }, KN_PAGE, none('noRejected'));

  function writeTrending() {

      [[D.goal, r.goal], [D.useToYou, r.use], [D.movement, r.movement], [D.trending, r.trending], [D.license, r.license]])), KN_PAGE, none('noTrending'));

  /* ---------- System: inner tabs ---------- */
  const SY_SUBS = ['status', 'rules', 'skills', 'cost', 'analysis'];
  const SY_LINK_PREFIX = 'system-';
  const SY_PAGE = 25;
  const SY_BUILD = { status: () => buildStatus(), rules: () => buildRules(), skills: () => buildSkills(), cost: () => buildCost(), analysis: () => buildAnalysis() };
  let sySub = 'status';
  let syBuilt = new Set();
  const sySubText = {};
  function buildSystem() {
    const box = $('#mg-sy-subs');
    if (!box.childElementCount) {
      SY_SUBS.forEach((k) => { const b = el('button', 'mg-view'); b.type = 'button'; b.dataset.sub = k; b.addEventListener('click', () => openSystem(k)); box.append(b); });

  /* Cost: periods are the full days before today; the cost script does not write today */

    const month = period(COST_DAYS); const week = period(COST_WEEK); const day = period(1); const monthTotal = usdSum(month);

  function drawGrowth(v) {
    const canvas = $('#mg-an-growth'); const W = canvas.clientWidth; const H = canvas.clientHeight; const first = v.days[0]; const A = T.an;

    const all = rows('log');
    const list = all.filter((r) => (!op || r.operation === op) && matchesSource(r, chat, project) && (!q || lower([r.title, r.operation, lbl('ops', r.operation), r.detail, r.chat, r.project].join(' ')).includes(q)))
      .sort((a, b) => Number(b.no) - Number(a.no));
    $('#mg-lg-n').textContent = fmt(L.ofRecords, { n: num(list.length), m: num(all.length) });
    paged(box, list, logRow, LOG_PAGE, all.length ? none('filterRecords') : T.empty);
  }
  // The Pending measure on Today opens the Log in the "open + closed" pending mode
  function openLogPending() { $('#mg-lg-op').value = PENDING_MODE; openTab('log'); writeLogList(); }

  /* ---------- Search (scored note search, project logs and the vault log) ---------- */
  let searchTimer = 0;
  function searchRow(r, top, text, action) {
    const li = r ? rowItem(r) : el('li', 'mg-row'); li.append(top); if (text) li.append(el('p', 'mg-two mg-muted', plain(text)));
    return action ? clickable(li, action) : li;
  }
  function topLine(title, ...extras) { const u = el('div', 'mg-top'); u.append(el('strong', '', title), ...extras.filter(Boolean)); return u; }
  function search() {
    const q = lower($('#mg-search').value.trim()); const S = T.sr;
    if (!q) { $('#mg-p-search').hidden = true; showPages(); return; }
    $('#mg-p-search').hidden = false; showPages();
    const ul = $('#mg-s-list'); ul.replaceChildren();
    const tasks = rows('tasks');
    const score = (n) => (lower(n.title).includes(q) ? 4 : 0) + (lower(n.aliases).includes(q) ? 4 : 0) + (lower(n.summary + ' ' + n.detail).includes(q) ? 2 : 0)
      + (lower([n.tags, n.project, n.id].join(' ')).includes(q) ? 1 : 0) + (tasks.some((g) => g.note_id === n.id && lower(g.task).includes(q)) ? 1 : 0);
    const notes = [...noteIndex.values()].map((n) => [score(n), n]).filter(([p]) => p > 0).sort((a, b) => b[0] - a[0] || String(b[1].updated).localeCompare(String(a[1].updated)));
    notes.slice(0, SEARCH_NOTE_LIMIT).forEach(([, n]) => ul.append(searchRow(n, topLine(plain(n.title), badge(lbl('types', n.type)), el('span', 'mg-right', relative(n.updated))), n.summary, () => noteDrawer(n.id))));
    const progress = rows('progress').filter((r) => lower(r.text + ' ' + r.title + ' ' + r.label).includes(q)).sort((a, b) => String(b.date).localeCompare(String(a.date)) || b.order - a.order);
    if (progress.length) ul.append(el('li', 'mg-row mg-muted', fmt(S.inProgress, { n: num(progress.length) })));
    progress.slice(0, SEARCH_PROGRESS_LIMIT).forEach((r) => ul.append(searchRow(r, topLine(projectName(r.project), el('span', 'mg-small mg-muted', plain(r.label)), el('span', 'mg-right', relative(r.date))), r.text || r.title,
      progressNotes.has(r.project) ? () => noteDrawer(progressNotes.get(r.project)) : null)));
    const log = rows('log').filter((r) => lower(r.title + ' ' + r.detail).includes(q)).sort((a, b) => Number(b.no) - Number(a.no));
    if (log.length) ul.append(el('li', 'mg-row mg-muted', fmt(S.inLog, { n: num(log.length) })));
    log.slice(0, SEARCH_LOG_LIMIT).forEach((r) => ul.append(searchRow(r, topLine(plain(r.title), badge(lbl('ops', r.operation)), el('span', 'mg-right', dateText(r.date))), r.detail)));
    const total = notes.length + progress.length + log.length;
    $('#mg-s-n').textContent = total ? fmt(S.found, { a: num(notes.length), b: num(progress.length), c: num(log.length) }) : S.noResults;
    if (notes.length > SEARCH_NOTE_LIMIT) ul.insertBefore(el('li', 'mg-row mg-muted', fmt(S.firstNotes, { n: SEARCH_NOTE_LIMIT })), ul.children[SEARCH_NOTE_LIMIT]);
  }

  /* ---------- Container height: 100vh is not assumed, it is measured ---------- */
  function measureHeight() {
    const shell = $('#mg');
    if (!matchMedia(`(min-width: ${FIT_WIDTH}px)`).matches) { shell.style.height = ''; return; }
    const top = shell.getBoundingClientRect().top + window.scrollY;
    const root = shell.parentElement;
    const bottomPad = root ? parseFloat(getComputedStyle(root).paddingBottom) || 0 : 0;
    // A container shorter than 700 px keeps a fixed height and the page scrolls instead
    const h = Math.max(MIN_HEIGHT, Math.floor(window.innerHeight - top - bottomPad));
    if (shell.style.height !== `${h}px`) shell.style.height = `${h}px`;
  }
  let heightFrame = 0;
  const askHeight = () => { cancelAnimationFrame(heightFrame); heightFrame = requestAnimationFrame(measureHeight); };

  /* ---------- Language: every word on the page comes from STRINGS ---------- */
  function applyLanguage() {
    T = STRINGS[lang];
    $('#mg').setAttribute('lang', lang);
    document.querySelectorAll('#mg [data-i18n]').forEach((x) => { x.textContent = lookup(x.dataset.i18n) ?? ''; });
    document.querySelectorAll('#mg [data-i18n-label]').forEach((x) => x.setAttribute('aria-label', lookup(x.dataset.i18nLabel) ?? ''));
    document.querySelectorAll('#mg [data-i18n-placeholder]').forEach((x) => x.setAttribute('placeholder', lookup(x.dataset.i18nPlaceholder) ?? ''));
    document.querySelectorAll('.mg-tab').forEach((b) => { b.firstChild.textContent = T.tabs[b.dataset.tab]; });
    document.querySelectorAll('#mg-palette button').forEach((b) => { const name = T.palettes[b.dataset.name]; b.title = name; b.setAttribute('aria-label', fmt(T.paletteButton, { name })); });
    const H = T.h;
    setFixedOptions($('#mg-ag-agent'), [['', H.allAgents]]);
    setFixedOptions($('#mg-ag-mode'), [['', H.allModes], ...MODE_FILTER.map((k) => [k, T.modes[k]])]);
    setFixedOptions($('#mg-ag-result'), [['', H.allResults], ...Object.keys(RESULT_FILTER).map((k) => [k, T.results[k]])]);
    setFixedOptions($('#mg-ds-rating'), [['', H.allRatings]]);
    setFixedOptions($('#mg-lg-op'), [['', H.allOps], [PENDING_MODE, H.pendingMode]]);
    setFixedOptions($('#mg-lg-project'), [['', H.allProjects]]);
    setFixedOptions($('#mg-lg-chat'), [['', H.allChats]]);
    setFixedOptions($('#mg-ru-source'), [['', H.allSources]]);
    setFixedOptions($('#mg-sk-kind'), [['', H.allKinds], ...SKILL_KINDS.map((k) => [k, lbl('skillKinds', k)])]);
    setFixedOptions($('#mg-sk-agent'), [['', H.allAgents]]);
    setFixedOptions($('#mg-an-project'), [['', H.allProjects]]);
  }

  /* ---------- Data arrival ---------- */
  function dataArrived() {
    const meta = rows('meta')[0];
    const next = meta && Object.hasOwn(STRINGS, meta.language) ? meta.language : DEFAULT_LANGUAGE;
    if (next !== lang) { lang = next; setFormats(); applyLanguage(); }
    indexNotes();
    flowCache = new Map(); dataVersion += 1;
    assignColors(['pending', 'agent_runs', 'notes'].flatMap((id) => rows(id)));
    writeTabCounts();
    toBuild = new Set(Object.keys(TAB_BUILD));
    buildOpenTab();
    if ($('#mg-search').value.trim()) search();
  }
  // Cheap signature: per data set the status, length and a fold of the fields that change in place (a pending item,
  // health or task that changes is caught too); the data is not turned into JSON
  const rowSig = (r) => (r && typeof r === 'object'
    ? `${r.key ?? r.id ?? ''}~${r.status ?? ''}~${r.updated ?? ''}~${r.done ?? ''}~${r.closed ?? ''}~${r.language ?? ''}~${typeof r.text === 'string' ? r.text.length : ''}`
    : String(r));
  const fold = (list) => { let h = 0; for (const r of list) { const m = rowSig(r); for (let i = 0; i < m.length; i++) h = (h * 31 + m.charCodeAt(i)) | 0; } return h; };
  const dataSig = () => DATASETS.map((id) => { const d = dash.data(id) || {}; const s = Array.isArray(d.data) ? d.data : []; return `${id}:${d.status}:${s.length}:${fold(s)}`; }).join('|');
  let lastSig = null;
  let buildTimer = 0;

  setFormats();
  const params = new URLSearchParams(location.search);
  setupTabs();
  setupPalette(params.get('palette'));
  applyLanguage();
  if (typeof dash === 'undefined' || typeof dash.data !== 'function') { $('#mg-t-title').textContent = T.noDash; return; }
  $('#mg-search').addEventListener('input', () => { clearTimeout(searchTimer); searchTimer = setTimeout(search, SEARCH_DELAY_MS); });
  $('#mg-d-close').addEventListener('click', closeDrawer);
  $('#mg-overlay').addEventListener('click', closeDrawer);
  $('#mg-pr-page').addEventListener('click', () => { if (projectPageId) noteDrawer(projectPageId); });
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeDrawer(); });
  if (typeof ResizeObserver === 'function') {
    new ResizeObserver(askHeight).observe(document.documentElement);
    new ResizeObserver(() => requestAnimationFrame(drawFlow)).observe($('#mg-f-canvas'));
    new ResizeObserver(() => requestAnimationFrame(drawStrip)).observe($('#mg-pr-strip'));
    new ResizeObserver(() => requestAnimationFrame(() => {
      if (!$('#mg-sy-analysis').hidden && $('#mg-an-period').childElementCount && ['notes', 'log'].every((id) => state(id) === 'ok')) fitAnalysis();
    })).observe($('#mg-an-growth'));
  }
  $('#mg-ru-source').addEventListener('change', (e) => { ruleFilter.source = e.target.value; writeRules(); });
  $('#mg-ru-search').addEventListener('input', (e) => { ruleFilter.q = e.target.value.trim(); clearTimeout(ruleSearchTimer); ruleSearchTimer = setTimeout(writeRules, SEARCH_DELAY_MS); });
  $('#mg-ru-viol-all').addEventListener('click', () => { ruleFilter.rule = ''; writeRules(); });
  ['kind', 'agent'].forEach((k) => $(`#mg-sk-${k}`).addEventListener('change', (e) => { skillFilter[k] = e.target.value; writeSkills(); }));
  $('#mg-sk-search').addEventListener('input', (e) => { skillFilter.q = e.target.value.trim(); clearTimeout(skillSearchTimer); skillSearchTimer = setTimeout(writeSkills, SEARCH_DELAY_MS); });
  $('#mg-an-project').addEventListener('change', (e) => { analysis.project = e.target.value; drawAnalysis(); });
  $('#mg-ag-agent').addEventListener('change', (e) => { pickedAgent = e.target.value; markPicked($('#mg-ag-team'), 'agent', pickedAgent); writeAgentLog(); });
  $('#mg-ag-result').addEventListener('change', writeAgentLog);
  $('#mg-ag-mode').addEventListener('change', writeAgentLog);
  ['#mg-lg-op', '#mg-lg-project', '#mg-lg-chat'].forEach((s) => $(s).addEventListener('change', writeLogList));
  $('#mg-lg-search').addEventListener('input', () => { clearTimeout(logSearchTimer); logSearchTimer = setTimeout(writeLogList, SEARCH_DELAY_MS); });
  window.addEventListener('resize', askHeight);
  measureHeight();
  // Address: ?tab=<tab>&sub=<inner tab>, or #tab, #projects-<project id>, #knowledge-<part>, #system-<part>
  let first = params.get('tab') || location.hash.slice(1);
  const sub = params.get('sub');
  if (first.startsWith(PROJECT_LINK_PREFIX)) { pickedProject = first.slice(PROJECT_LINK_PREFIX.length); first = 'projects'; }
  if (first.startsWith(KN_LINK_PREFIX) && KN_SUBS.includes(first.slice(KN_LINK_PREFIX.length))) { knSub = first.slice(KN_LINK_PREFIX.length); first = 'knowledge'; }
  if (first.startsWith(SY_LINK_PREFIX) && SY_SUBS.includes(first.slice(SY_LINK_PREFIX.length))) { sySub = first.slice(SY_LINK_PREFIX.length); first = 'system'; }
  if (sub && first === 'knowledge' && KN_SUBS.includes(sub)) knSub = sub;
  if (sub && first === 'system' && SY_SUBS.includes(sub)) sySub = sub;
  if (sub && first === 'flow' && Object.hasOwn(FLOW, sub)) flowState.view = sub;
  if (sub && first === 'projects') pickedProject = sub;
  openTab(TABS.includes(first) ? first : 'today', false);
  dataArrived();
  dash.onData(() => {
    const sig = dataSig();
    if (sig === lastSig) return;
    lastSig = sig;
    clearTimeout(buildTimer);
    // Data sets that arrive one after another are gathered; when the last one is in, the page builds at once
    if (DATASETS.some((id) => state(id) === 'loading')) buildTimer = setTimeout(dataArrived, BUILD_DELAY_MS);
    else dataArrived();
  });
})();
</script>
