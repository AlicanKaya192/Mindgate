<style>
/* Dashboard: rail, tabs and panels. Three dark palettes carry the same roles, so switching one never moves the layout. */
#dash-root, #dash-root[data-palette="ink"] {
  --ground: #0b1020; --panel: #121a2b; --panel-2: #18223a; --line: #26324c;
  --text: #e6e3dc; --muted: #9aa2ab; --accent: #8ab4f0; --accent-ground: #1c2a3d;
  --good: #6fc59a; --warn: #e5ae5b; --bad: #ee8379;
  --c1: #8ab4f0; --c2: #e5ae5b; --c3: #b59cf0; --c4: #6fc59a; --c5: #ee8fa8; --c6: #9aa2ab;
}
#dash-root[data-palette="graphite"] {
  --ground: #161412; --panel: #1f1c19; --panel-2: #28241f; --line: #3a342d;
  --text: #ece8e1; --muted: #a39e95; --accent: #d9925f; --accent-ground: #3a271a;
  --good: #8cc08a; --warn: #e6c15a; --bad: #e8796b;
  --c1: #d9925f; --c2: #e6c15a; --c3: #8cb4c9; --c4: #8cc08a; --c5: #c99ac0; --c6: #a39e95;
}
#dash-root[data-palette="pine"] {
  --ground: #091612; --panel: #0f221b; --panel-2: #152c24; --line: #223d32;
  --text: #e3ede8; --muted: #93a79f; --accent: #b5d67a; --accent-ground: #25321a;
  --good: #6dc7b0; --warn: #e8b65e; --bad: #ee8a7e;
  --c1: #b5d67a; --c2: #e8b65e; --c3: #8fb6e8; --c4: #6dc7b0; --c5: #e79bb0; --c6: #93a79f;
}
#dash-root {
  --sp1: 4px; --sp2: 8px; --sp3: 12px; --sp4: 16px; --sp5: 24px;
  --radius: 10px; --radius-inner: 6px;
  --fs-small: 12px; --fs-body: 14px; --fs-heading: 16px;
  --font: "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif;
  --font-num: "Segoe UI Variable Display", "Segoe UI", system-ui, sans-serif;
  --body-h: 420px;
  color-scheme: dark; background: var(--ground); color: var(--text);
  transition: background-color .2s ease-out;
}
.mg, .mg * { box-sizing: border-box; }
.mg { display: grid; grid-template-columns: 208px minmax(0, 1fr); min-height: 640px; font: 400 var(--fs-body)/1.45 var(--font); color: var(--text); background: var(--ground); }
.mg-h1, .mg-h2, .mg-h3, .mg-sub, .mg-list, .mg-text, .mg-pre, .mg-two, .mg-empty, .mg-fields, .mg-fields dd { margin: 0; }
.mg-h1 { font-size: 24px; font-weight: 650; letter-spacing: -.01em; }
.mg-h2 { font-size: var(--fs-heading); font-weight: 600; }
.mg-h3 { font-size: var(--fs-small); color: var(--muted); font-weight: 600; margin-bottom: var(--sp1); }
.mg [hidden] { display: none !important; }
.mg :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.mg-panel :focus-visible { outline-offset: -2px; }
.mg-muted { color: var(--muted); }
.mg-small { font-size: var(--fs-small); }
.mg-num { font-family: var(--font-num); font-variant-numeric: tabular-nums; }
.mg-sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* Rail: name, tabs, palette */
.mg-rail { display: flex; flex-direction: column; gap: var(--sp3); padding: var(--sp5) var(--sp3); border-right: 1px solid var(--line); min-width: 0; }
.mg-name { font-weight: 700; padding: 0 var(--sp3); }
.mg-tabs { display: flex; flex-direction: column; gap: 2px; }
.mg-tab { display: flex; align-items: center; gap: var(--sp2); background: none; border: 0; padding: var(--sp2) var(--sp3); border-radius: var(--radius-inner); color: var(--muted); font: inherit; cursor: pointer; white-space: nowrap; text-align: left; transition: background-color .12s ease-out, color .12s ease-out; }
.mg-tab:hover { color: var(--text); background: var(--panel-2); }
.mg-tab[aria-current="page"] { color: var(--accent); background: var(--accent-ground); font-weight: 600; }
.mg-palette { margin-top: auto; padding: 0 var(--sp3); display: flex; flex-direction: column; gap: var(--sp2); }
.mg-palette-pick { display: flex; gap: var(--sp2); }
.mg-swatch { width: 28px; height: 28px; border-radius: 50%; border: 2px solid var(--line); cursor: pointer; padding: 0; }
.mg-swatch[aria-pressed="true"] { border-color: var(--text); }
.mg-sw-ink { background: linear-gradient(135deg, #0b1020 50%, #8ab4f0 50%); }
.mg-sw-graphite { background: linear-gradient(135deg, #161412 50%, #d9925f 50%); }
.mg-sw-pine { background: linear-gradient(135deg, #091612 50%, #b5d67a 50%); }

/* Main area, header and measures */
.mg-main { display: flex; flex-direction: column; gap: var(--sp4); padding: var(--sp5); min-width: 0; }
.mg-head { display: flex; align-items: flex-end; justify-content: space-between; gap: var(--sp5); flex-wrap: wrap; }
.mg-head > div:first-child { min-width: 0; }
.mg-sub { margin-top: var(--sp1); }
.mg-measures { display: flex; flex-wrap: wrap; gap: var(--sp2); }
.mg-measure { display: flex; flex-direction: column; align-items: flex-start; min-width: 112px; padding: var(--sp2) var(--sp3); background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); color: inherit; font: inherit; cursor: pointer; text-align: left; transition: border-color .12s ease-out; }
.mg-measure:hover { border-color: var(--accent); }
.mg-measure > span { max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.mg-measure-v { font-size: 22px; font-weight: 600; line-height: 1.2; }
.mg-measure.mg-alert .mg-measure-v { color: var(--warn); }

/* Panel: fixed head, body scrolls inside */
.mg-page { display: flex; flex-direction: column; gap: var(--sp4); min-width: 0; }
.mg-panel { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); display: flex; flex-direction: column; min-width: 0; }
.mg-panel-head { display: flex; align-items: baseline; justify-content: space-between; flex-wrap: wrap; gap: var(--sp2) var(--sp3); padding: var(--sp4) var(--sp4) var(--sp3); }
.mg-extra { font-size: var(--fs-small); color: var(--muted); white-space: nowrap; }
.mg-body { padding: 0 var(--sp4) var(--sp4); overflow: auto; max-height: var(--body-h); scrollbar-width: thin; scrollbar-color: var(--line) transparent; }
.mg-tall { --body-h: 880px; }
.mg-empty { color: var(--muted); padding: var(--sp2) 0; }
.mg-controls { display: flex; flex-wrap: wrap; gap: var(--sp2); align-items: center; }
.mg-input { background: var(--panel-2); color: var(--text); border: 1px solid var(--line); border-radius: var(--radius-inner); padding: var(--sp1) var(--sp2); font: inherit; font-size: var(--fs-small); min-height: 28px; min-width: 0; max-width: 100%; }
.mg-input::placeholder { color: var(--muted); }

/* Badges */
.mg-badge { display: inline-flex; align-items: center; gap: 6px; font-size: var(--fs-small); color: var(--muted); white-space: nowrap; }
.mg-badge::before { content: ""; flex: none; width: 7px; height: 7px; border-radius: 50%; background: var(--dot, var(--c6)); }
.mg-c1 { --dot: var(--c1); } .mg-c2 { --dot: var(--c2); } .mg-c3 { --dot: var(--c3); } .mg-c4 { --dot: var(--c4); } .mg-c5 { --dot: var(--c5); } .mg-c6 { --dot: var(--c6); }
.mg-good { --dot: var(--good); } .mg-warn { --dot: var(--warn); } .mg-bad { --dot: var(--bad); }
.mg-badge.mg-warn { color: var(--warn); }

/* Rows */
.mg-list { list-style: none; padding: 0; }
.mg-row { padding: var(--sp3) var(--sp2); border-top: 1px solid var(--line); border-radius: var(--radius-inner); }
.mg-row:first-child { border-top: 0; }
.mg [role="button"] { cursor: pointer; }
.mg-row[role="button"]:hover { background: var(--panel-2); }
.mg-row[aria-current="true"] { background: var(--accent-ground); }
.mg-row[aria-current="true"] .mg-title { color: var(--accent); }
.mg-top { display: flex; align-items: center; flex-wrap: wrap; gap: 2px var(--sp3); margin-bottom: 2px; min-width: 0; }
.mg-title { font-weight: 600; overflow-wrap: anywhere; min-width: 0; }
.mg-right { margin-left: auto; font-size: var(--fs-small); color: var(--muted); white-space: nowrap; }
.mg-code { font-size: var(--fs-small); color: var(--muted); font-variant-numeric: tabular-nums; }
.mg-two { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; overflow-wrap: anywhere; color: var(--muted); max-width: 75ch; }

/* Count bars */
.mg-bar-row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: var(--sp1) var(--sp3); padding: var(--sp2); border-top: 1px solid var(--line); border-radius: var(--radius-inner); }
.mg-bar-row:first-child { border-top: 0; }
.mg-bar-row[role="button"]:hover { background: var(--panel-2); }
.mg-bar-label { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.mg-bar { grid-column: 1 / -1; height: 4px; border-radius: 2px; background: var(--panel-2); }
.mg-bar-fill { display: block; height: 100%; border-radius: 2px; background: var(--accent); opacity: .8; }

/* Table */
.mg-table { width: 100%; border-collapse: collapse; }
.mg-table th { position: sticky; top: 0; background: var(--panel); text-align: left; font-weight: 500; font-size: var(--fs-small); color: var(--muted); padding: 0 var(--sp3) var(--sp2) 0; border-bottom: 1px solid var(--line); }
.mg-table td { padding: var(--sp2) var(--sp3) var(--sp2) 0; border-bottom: 1px solid var(--line); vertical-align: top; overflow-wrap: anywhere; }
.mg-table td:first-child { font-weight: 600; }
.mg-table tr:last-child td { border-bottom: 0; }
.mg-table tr[role="button"]:hover td { background: var(--panel-2); }
.mg-table .mg-end { text-align: right; white-space: nowrap; padding-left: var(--sp3); }
.mg-table th:last-child, .mg-table td:last-child { padding-right: 0; }

/* Grids per tab */
.mg-grid { display: grid; gap: var(--sp4); grid-template-columns: repeat(auto-fit, minmax(min(100%, 320px), 1fr)); align-items: stretch; }
.mg-grid-two { grid-template-columns: minmax(0, 1fr) minmax(0, 1.5fr); }
.mg-grid-wide-left { grid-template-columns: minmax(0, 1.7fr) minmax(0, 1fr); }
.mg-rows-2 { grid-row: span 2; }
.mg-full { grid-column: 1 / -1; }
.mg-pair { display: grid; gap: var(--sp4); grid-template-columns: repeat(auto-fit, minmax(min(100%, 260px), 1fr)); min-width: 0; }

/* Drawer: opens from the right, edge line only */
.mg-overlay { position: fixed; inset: 0; background: rgba(0, 0, 0, .45); z-index: 20; }
.mg-drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(480px, 100%); background: var(--panel); border-left: 1px solid var(--line); z-index: 21; display: flex; flex-direction: column; animation: mg-in .16s ease-out; }
@keyframes mg-in { from { transform: translateX(24px); opacity: 0; } to { transform: none; opacity: 1; } }
.mg-d-head { display: flex; align-items: flex-start; gap: var(--sp3); padding: var(--sp5) var(--sp5) var(--sp3); }
.mg-d-head .mg-h2 { flex: 1; font-size: 18px; overflow-wrap: anywhere; }
.mg-close { background: var(--panel-2); border: 1px solid var(--line); border-radius: var(--radius-inner); padding: var(--sp1) var(--sp3); color: inherit; font: inherit; cursor: pointer; min-height: 32px; }
.mg-d-body { padding: 0 var(--sp5) var(--sp5); overflow: auto; display: flex; flex-direction: column; gap: var(--sp4); }
.mg-text { white-space: pre-line; overflow-wrap: anywhere; }
.mg-pre { white-space: pre-wrap; overflow-wrap: anywhere; }
.mg-badges { display: flex; flex-wrap: wrap; gap: var(--sp3); }
.mg-fields { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: var(--sp1) var(--sp4); font-size: var(--fs-small); }
.mg-fields dt { color: var(--muted); }
.mg-fields dd { overflow-wrap: anywhere; }

@media (prefers-reduced-motion: reduce) {
  #dash-root, .mg * { transition: none !important; animation: none !important; }
}
/* Narrow screen: the rail becomes a top bar, panels stack */
@media (max-width: 900px) {
  #dash-root { --fs-body: 16px; --fs-small: 13px; }
  .mg { grid-template-columns: minmax(0, 1fr); min-height: 0; }
  .mg-rail { flex-direction: row; flex-wrap: wrap; align-items: center; border-right: 0; border-bottom: 1px solid var(--line); padding: var(--sp3) var(--sp4); }
  .mg-name { padding: 0; }
  .mg-palette { margin: 0 0 0 auto; padding: 0; }
  .mg-palette > .mg-small { display: none; }
  .mg-swatch { width: 44px; height: 44px; }
  .mg-tabs { order: 3; flex-basis: 100%; flex-direction: row; flex-wrap: wrap; }
  .mg-tab { min-height: 44px; }
  .mg-main { padding: var(--sp4); }
  .mg-measures { width: 100%; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .mg-measure { min-width: 0; min-height: 44px; }
  .mg-grid, .mg-grid-two, .mg-grid-wide-left, .mg-pair { grid-template-columns: minmax(0, 1fr); }
  .mg-rows-2, .mg-full { grid-row: auto; grid-column: auto; }
  .mg-tall { --body-h: 520px; }
  .mg-input { min-height: 44px; font-size: 16px; flex: 1 1 140px; }
  .mg-close, .mg-row, .mg-bar-row { min-height: 44px; }
}
@media (max-width: 640px) {
  .mg-table thead { display: none; }
  .mg-table tr { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; gap: 0 var(--sp3); padding: var(--sp2) 0; border-bottom: 1px solid var(--line); }
  .mg-table td { border: 0 !important; padding: 0 !important; }
  .mg-table td:nth-child(4) { grid-column: 1 / -1; padding-top: 2px !important; color: var(--muted); }
}
</style>

  const STATUS_BADGE = { open: 'mg-warn', solved: 'mg-good', done: 'mg-good', active: 'mg-c1' };

  /* ---------- Helpers ---------- */

  const pick = (map, key) => (map && Object.hasOwn(map, key) ? map[key] : undefined);
  let lang = DEFAULT_LANGUAGE;
  const S = () => STRINGS[lang];
  const lookup = (path) => path.split('.').reduce((node, part) => pick(node, part), S());
  const fmt = (template, values) => String(template).replace(/\{(\w+)\}/g, (all, k) => (Object.hasOwn(values, k) ? values[k] : all));
  const label = (group, value) => { const text = pick(S()[group], String(value ?? '')); return text === undefined ? String(value ?? '') : text; };
  const show = (value) => {
    const text = value == null ? '' : String(value);
    return text.includes(HIDDEN_TEXT) ? text.split('\n').map((line) => (line.trim() === HIDDEN_TEXT ? S().hidden : line)).join('\n') : text;
  };
  // Display text: secret-scan marker in the page language, wiki links and bold marks as plain words
  const plain = (value) => show(value).replace(/\[\[([^\]|]+)\|([^\]]+)\]\]/g, '$2').replace(/\[\[([^\]]+)\]\]/g, '$1').replace(/\*\*/g, '');
  const oneLine = (value) => plain(value).replace(/\s+/g, ' ').trim();
  let numberFormat, dateFormat, moneyFormat;
  function setFormats() {
    numberFormat = new Intl.NumberFormat(lang);

  }
  const num = (n) => numberFormat.format(Number(n) || 0);
  const money = (n) => moneyFormat.format(Number(n) || 0);
  function day(value) {
    const text = String(value ?? '').slice(0, 10);

  const statusOf = (id) => { const d = dash.data(id); return (d && d.status) || 'missing'; };

  const projectName = (id) => { const n = noteIndex.get(id); return n ? plain(n.title).split(' — ')[0] : String(id ?? ''); };
  const logTitle = (r) => (r.title ? plain(r.title) : r.operation === 'profile' ? S().profileUpdated : r.operation === 'rule' ? S().ruleUpdated : '—');

  /* ---------- Panels ---------- */
  const listBox = (list) => $(`[data-list="${list}"]`);
  const limitOf = (box) => Number(box.dataset.limit) || 0;
  const limited = (box, all) => (limitOf(box) > 0 ? all.slice(0, limitOf(box)) : all);
  function setExtra(list, value) { const x = $(`[data-extra="${list}"]`); if (x) x.textContent = value; }
  // A data set that is not ready writes its state into the panel; nothing is computed on missing data
  function ready(list, ids) {
    const state = ids.map(statusOf).find((s) => s !== 'ok');

    listBox(list).replaceChildren(el('p', 'mg-empty', pick(S().state, state) || S().state.error));
    setExtra(list, '');
    return false;
  }
  function fill(list, items, emptyText) {
    const box = listBox(list);
    if (!items.length) { box.replaceChildren(el('p', 'mg-empty', emptyText || S().empty)); return; }

  }

  function listPanel(list, ids, getRows, drawRow, extra) {
    if (!ready(list, ids)) return;
    const all = getRows();
    const shown = limited(listBox(list), all);
    fill(list, shown.map(drawRow));
    setExtra(list, extra ? extra(all, shown) : all.length ? num(all.length) : '');
  }
  function clickable(x, action) {

  // Count bars: one row per value of a field; the widest bar is the largest group
  function countPanel(list, id, field, group, action) {
    if (!ready(list, [id])) return;

    rows(id).forEach((r) => { const k = text(r, field); counts.set(k, (counts.get(k) || 0) + 1); });
    const groups = [...counts].sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0]));
    const largest = groups.reduce((m, [, n]) => (n > m ? n : m), 0);
    fill(list, groups.map(([key, n]) => {

  /* ---------- Drawer (the one detail view) ---------- */

  /* ---------- Header: title and short measures ---------- */
  function measure(name, tab) {

    $('#mg-title').textContent = S().tabs[active];
    const meta = rows('meta')[0];
    $('#mg-sub').textContent = meta && meta.generated ? fmt(S().dataDate, { date: day(meta.generated) }) : '';
    const ok = (id) => statusOf(id) === 'ok';
    writeMeasure('pending', ok('pending') ? num(openPending().length) : '—');
    writeMeasure('tasks', ok('tasks') ? num(rows('tasks').filter((t) => Number(t.done) === 0).length) : '—');
    const w = warnings().length;
    writeMeasure('warnings', ok('health') ? num(w) : '—', w > 0);
  }

  /* ---------- Today ---------- */
  function buildToday() {
    listPanel('today-pending', ['pending'], () => openPending().sort((a, b) => newestFirst('date')(a, b) || text(b, 'key').localeCompare(text(a, 'key'))),
      (p) => item(p, { badges: [badge(label('kinds', p.kind), pick(PENDING_BADGE, p.kind))], code: p.id, title: p.project ? projectName(p.project) : '', right: day(p.date), text: oneLine(p.text) },
        () => pendingDrawer(p)));
    listPanel('today-handoff', ['handoff'], () => rows('handoff'),
      (h) => item(h, { title: plain(h.label), right: `${day(h.date)} ${text(h, 'time')}`.trim(), text: oneLine(h.text) }, () => handoffDrawer(h)));
    listPanel('today-log', ['log'], () => rows('log').sort(byKeyNumber),
      (r) => item(r, { badges: [badge(label('operations', r.operation))], title: logTitle(r), right: day(r.date) }, () => logDrawer(r)));
    listPanel('today-health', ['health'], () => healthSorted().filter((h) => h.status === 'warning' || h.status === 'error'), healthRow);
  }
  const healthSorted = () => rows('health').map((h, i) => [h, i])
    .sort((a, b) => (pick(HEALTH_ORDER, a[0].status) ?? 9) - (pick(HEALTH_ORDER, b[0].status) ?? 9) || a[1] - b[1]).map(([h]) => h);
  const healthRow = (h) => item(h, { badges: [badge(label('health', h.status), pick(HEALTH_BADGE, h.status))], title: plain(h.check), text: plain(h.summary) },
    () => openDrawer(plain(h.check), [badgeRow([badge(label('health', h.status), pick(HEALTH_BADGE, h.status))]), section(S().f.summary, plain(h.summary)),
      h.advice ? section(S().f.advice, plain(h.advice)) : null]));

  /* ---------- Projects ---------- */
  let selectedProject = '';
  const projects = () => rows('notes').filter((n) => n.type === 'project').sort(newestFirst('updated'));
  function selectProject(id, withDrawer) {
    selectedProject = id;
    listBox('projects-list').querySelectorAll('[data-key]').forEach((x) => { if (x.dataset.key === id) x.setAttribute('aria-current', 'true'); else x.removeAttribute('aria-current'); });
    buildProjectDetail();
    if (withDrawer) openNote(id);
  }
  function buildProjects() {
    const list = projects();
    if (!list.some((p) => p.key === selectedProject)) selectedProject = list.length ? list[0].key : '';
    listPanel('projects-list', ['notes'], () => list,
      (p) => item(p, { badges: [p.status ? badge(label('status', p.status), pick(STATUS_BADGE, p.status)) : null], title: projectName(p.key), right: day(p.updated), text: oneLine(p.summary) },
        () => selectProject(p.key, true)));
    selectProject(selectedProject, false);
  }
  function buildProjectDetail() {
    if (statusOf('notes') === 'ok' && !selectedProject) {   // no project at all: the detail panels stay empty
      ['project-progress', 'project-tasks', 'project-notes'].forEach((list) => { fill(list, []); setExtra(list, ''); });
      return;
    }
    listPanel('project-progress', ['notes', 'progress'],
      () => rows('progress').filter((r) => r.project === selectedProject).sort((a, b) => newestFirst('date')(a, b) || (Number(a.order) || 0) - (Number(b.order) || 0)),
      (r) => item(r, { title: plain(r.label || r.title), right: day(r.date), text: oneLine(r.text) },
        () => openDrawer(plain(r.label || r.title) || S().panels['project-progress'], [section(S().f.text, plain(r.text)),
          fields([['date', day(r.date)], ['project', projectName(r.project)]])])),
      () => projectName(selectedProject));
    listPanel('project-tasks', ['notes', 'tasks'], () => rows('tasks').filter((t) => t.project === selectedProject && Number(t.done) === 0),
      (t) => item(t, { title: plain(t.task), right: plain(t.note) }, () => (noteIndex.has(t.note_id) ? openNote(t.note_id)
        : openDrawer(plain(t.task), [fields([['note', plain(t.note)], ['project', projectName(t.project)]])]))));
    listPanel('project-notes', ['notes'], () => rows('notes').filter((n) => n.project === selectedProject).sort(newestFirst('updated')), noteRow);
  }
  const noteRow = (n) => item(n, { badges: [badge(label('types', n.type), pick(TYPE_BADGE, n.type))], title: plain(n.title), right: day(n.updated), text: oneLine(n.summary) }, () => noteDrawer(n));

  /* ---------- Flow ---------- */
  function buildFlow() {
    countPanel('flow-log', 'log', 'operation', 'operations', (op) => { logOperation = op; dirty.add('log'); openTab('log', true); });
    countPanel('flow-notes', 'notes', 'type', 'types', (type) => { knowledge.type = type; knowledge.query = ''; dirty.add('knowledge'); openTab('knowledge', true); });
    countPanel('flow-pending', 'pending', 'kind', 'kinds');
  }

  /* ---------- Agents ---------- */
  function buildAgents() {
    if (ready('agents-list', ['agents'])) {
      const agents = rows('agents');
      const box = listBox('agents-list');
      if (!agents.length) fill('agents-list', []);
      else {
        const table = el('table', 'mg-table'); const head = el('tr');
        [['name'], ['model'], ['runs', 'mg-end'], ['lastRun', 'mg-end']].forEach(([name, cls]) => head.append(el('th', cls || '', S().f[name])));
        const thead = el('thead'); thead.append(head); const tbody = el('tbody');
        limited(box, agents).forEach((a) => {
          const tr = el('tr'); tr.dataset.key = String(a.key);
          tr.append(el('td', '', plain(a.name)), el('td', 'mg-muted', plain(a.model)), el('td', 'mg-end mg-num', num(a.runs)), el('td', 'mg-end mg-muted', a.last_run ? day(a.last_run) : '—'));
          tbody.append(clickable(tr, () => openDrawer(plain(a.name), [section(S().f.description, plain(a.description)),
            fields([['model', plain(a.model)], ['runs', num(a.runs)], ['lastRun', a.last_run ? day(a.last_run) : '']])])));
        });
        table.append(thead, tbody); box.replaceChildren(table);
      }
      setExtra('agents-list', agents.length ? num(agents.length) : '');
    }
    listPanel('agents-runs', ['agent_runs'], () => rows('agent_runs').sort(newestFirst('date')),
      (r) => item(r, { badges: [r.mode ? badge(fmt(S().mode, { n: r.mode }), 'mg-c1') : null], code: plain(r.agent), title: plain(r.job), right: day(r.date), text: plain(r.result) },
        () => openDrawer(plain(r.job), [section(S().f.result, plain(r.result)),
          fields([['agent', plain(r.agent)], ['date', day(r.date)], ['mode', r.mode], ['model', plain(r.model)], ['project', r.project ? projectName(r.project) : '']])])));
    listPanel('agents-councils', ['councils'], () => rows('councils').sort(newestFirst('date')),
      (c) => item(c, { badges: [c.mode ? badge(fmt(S().mode, { n: c.mode }), 'mg-c2') : null], title: plain(c.title), right: day(c.date), text: plain(c.agents) },
        () => (noteIndex.has(c.key) ? openNote(c.key) : openDrawer(plain(c.title), [fields([['mode', c.mode], ['agents', plain(c.agents)], ['result', plain(c.result)],
          ['calls', c.calls], ['project', c.project ? projectName(c.project) : ''], ['date', day(c.date)]])]))));
    listPanel('agents-expertise', ['expertise'], () => rows('expertise'),
      (x) => item(x, { title: plain(x.name), right: fmt(S().lessons, { n: num(x.lessons) }), text: plain(x.description) },
        () => openDrawer(plain(x.name), [section(S().f.description, plain(x.description)), fields([['lessons', num(x.lessons)], ['lastLesson', x.last_lesson ? day(x.last_lesson) : '']])])));
  }

  /* ---------- Knowledge ---------- */
  const knowledge = { query: '', type: '' };
  function fillSelect(select, allText, values, group, current) {
    const first = el('option', '', allText); first.value = '';
    const options = values.map((v) => { const o = el('option', '', label(group, v)); o.value = v; return o; });
    select.replaceChildren(first, ...options);
    select.value = values.includes(current) ? current : '';
    return select.value;
  }
  const distinct = (list, field, group) => [...new Set(list.map((r) => text(r, field)).filter(Boolean))].sort((a, b) => label(group, a).localeCompare(label(group, b), lang));
  function matchesQuery(n, terms) {
    const haystack = lower(`${show(n.title)} ${show(n.summary)} ${show(n.tags)}`);
    return terms.every((t) => haystack.includes(t));
  }
  function buildKnowledgeNotes() {
    const terms = lower(knowledge.query).split(/\s+/).filter(Boolean);
    listPanel('knowledge-notes', ['notes'],
      () => rows('notes').filter((n) => (!knowledge.type || n.type === knowledge.type) && matchesQuery(n, terms)).sort(newestFirst('updated')),
      noteRow, (all, shown) => fmt(S().shown, { n: num(shown.length), m: num(all.length) }));
  }
  function buildKnowledge() {
    $('#mg-k-search').value = knowledge.query;
    knowledge.type = fillSelect($('#mg-k-type'), S().allTypes, distinct(rows('notes'), 'type', 'types'), 'types', knowledge.type);
    buildKnowledgeNotes();
    const openFirst = (a, b) => (a.status === 'open' ? 0 : 1) - (b.status === 'open' ? 0 : 1) || newestFirst('updated')(a, b);
    listPanel('knowledge-problems', ['notes'], () => rows('notes').filter((n) => n.type === 'problem').sort(openFirst),
      (n) => item(n, { badges: [badge(label('status', n.status), pick(STATUS_BADGE, n.status))], title: plain(n.title), right: day(n.updated), text: oneLine(n.summary) }, () => noteDrawer(n)));
    listPanel('knowledge-decisions', ['notes'], () => rows('notes').filter((n) => n.type === 'decision').sort(newestFirst('updated')),
      (n) => item(n, { badges: [n.status ? badge(label('status', n.status), pick(STATUS_BADGE, n.status)) : null], title: plain(n.title), right: day(n.updated), text: oneLine(n.summary) }, () => noteDrawer(n)));
  }

  /* ---------- System ---------- */
  function buildSystem() {
    listPanel('system-health', ['health'], healthSorted, healthRow);
    listPanel('system-rules', ['rules'], () => rows('rules').sort((a, b) => (Number(a.number) || 0) - (Number(b.number) || 0)),
      (r) => {
        const marks = [r.optional === true ? badge(S().optional, 'mg-c3') : null, Number(r.violations) > 0 ? badge(fmt(S().violations, { n: num(r.violations) }), 'mg-warn') : null];
        return item(r, { badges: marks, code: `#${r.number}`, title: plain(r.title) }, () => openDrawer(`#${r.number} ${plain(r.title)}`, [badgeRow(marks.map((m) => m && m.cloneNode(true))),
          section(S().f.text, plain(r.text)), r.why ? section(S().f.why, plain(r.why)) : null]));
      });
    listPanel('system-skills', ['skills'], () => rows('skills').sort((a, b) => (pick(SKILL_ORDER, a.kind) ?? 9) - (pick(SKILL_ORDER, b.kind) ?? 9) || text(a, 'name').localeCompare(text(b, 'name'))),
      (s) => item(s, { badges: [badge(label('skillKinds', s.kind), pick(SKILL_BADGE, s.kind))], title: plain(s.name), right: fmt(S().uses, { n: num(s.uses) }), text: plain(s.description) },
        () => openDrawer(plain(s.name), [badgeRow([badge(label('skillKinds', s.kind), pick(SKILL_BADGE, s.kind))]), section(S().f.description, plain(s.description)),
          fields([['uses', num(s.uses)], ['lastUsed', s.last_used ? day(s.last_used) : '']])])));
    listPanel('system-tools', ['system'], () => rows('system').sort((a, b) => (pick(SYSTEM_ORDER, a.kind) ?? 9) - (pick(SYSTEM_ORDER, b.kind) ?? 9) || text(a, 'name').localeCompare(text(b, 'name'))),
      (t) => item(t, { badges: [badge(label('systemKinds', t.kind), pick(SYSTEM_BADGE, t.kind))], title: plain(t.name),
        right: t.kind === 'tool' ? (Number(t.has_test) ? S().hasTest : S().noTest) : plain(t.event || t.status) },
      () => openDrawer(plain(t.name), [badgeRow([badge(label('systemKinds', t.kind), pick(SYSTEM_BADGE, t.kind))]),
        fields([['kind', label('systemKinds', t.kind)], ['event', plain(t.event)], ['status', plain(t.status)], ['date', t.date ? day(t.date) : ''],
          ['test', t.kind === 'tool' ? (Number(t.has_test) ? S().hasTest : S().noTest) : '']])])));
    let total = 0;
    listPanel('system-cost', ['cost'], () => {
      const byModel = new Map();
      rows('cost').forEach((r) => { const m = text(r, 'model'); const g = byModel.get(m) || { key: m, model: m, cost: 0, days: 0 }; g.cost += Number(r.cost_usd) || 0; g.days += 1; byModel.set(m, g); });
      const groups = [...byModel.values()].sort((a, b) => b.cost - a.cost || a.model.localeCompare(b.model));
      total = groups.reduce((sum, g) => sum + g.cost, 0);
      return groups;
    }, (g) => item(g, { title: g.model || S().none, right: money(g.cost) }, () => openDrawer(g.model || S().none, [fields([['cost', money(g.cost)], ['days', num(g.days)]])])),
    (all) => (all.length ? money(total) : ''));
  }

  /* ---------- Log ---------- */
  let logOperation = '';
  function buildLogList() {
    listPanel('log-all', ['log'], () => rows('log').filter((r) => !logOperation || r.operation === logOperation).sort(byKeyNumber),
      (r) => item(r, { badges: [badge(label('operations', r.operation))], code: r.key, title: logTitle(r), right: day(r.date), text: oneLine(r.detail) }, () => logDrawer(r)),
      (all, shown) => fmt(S().shown, { n: num(shown.length), m: num(all.length) }));
  }
  function buildLog() {
    logOperation = fillSelect($('#mg-l-op'), S().allOperations, distinct(rows('log'), 'operation', 'operations'), 'operations', logOperation);
    buildLogList();
  }

  /* ---------- Tabs: only the open tab is built ---------- */
  const BUILD = { today: buildToday, projects: buildProjects, flow: buildFlow, agents: buildAgents, knowledge: buildKnowledge, system: buildSystem, log: buildLog };
  let active = 'today';
  let dirty = new Set(TABS);
  function buildOpen() { if (dirty.delete(active)) BUILD[active](); }
  function openTab(id, link) {
    active = TABS.includes(id) ? id : 'today';
    document.querySelectorAll('.mg-page').forEach((p) => { p.hidden = p.dataset.tab !== active; });
    document.querySelectorAll('.mg-tab').forEach((b) => { if (b.dataset.tab === active) b.setAttribute('aria-current', 'page'); else b.removeAttribute('aria-current'); });
    writeHeader();
    if (link && typeof dash.setLink === 'function') dash.setLink(active);
    buildOpen();
    document.querySelectorAll('.mg-body').forEach((b) => { b.scrollTop = 0; });
  }

  /* ---------- Language and palette ---------- */
  function applyLanguage() {
    $('#mg').setAttribute('lang', lang);
    document.querySelectorAll('[data-i18n]').forEach((x) => { x.textContent = lookup(x.dataset.i18n) ?? ''; });
    document.querySelectorAll('[data-i18n-label]').forEach((x) => x.setAttribute('aria-label', lookup(x.dataset.i18nLabel) ?? ''));
    document.querySelectorAll('[data-i18n-placeholder]').forEach((x) => x.setAttribute('placeholder', lookup(x.dataset.i18nPlaceholder) ?? ''));
    document.querySelectorAll('.mg-tab').forEach((b) => { b.textContent = S().tabs[b.dataset.tab]; });
    document.querySelectorAll('.mg-swatch').forEach((b) => { const name = S().palettes[b.dataset.palette]; b.title = name; b.setAttribute('aria-label', fmt(S().paletteButton, { name })); });
  }
  function applyPalette(name) {
    const root = document.getElementById('dash-root');
    if (root) root.dataset.palette = name;
    document.querySelectorAll('.mg-swatch').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.palette === name)));
  }
  function setup() {
    TABS.forEach((id) => {
      const b = el('button', 'mg-tab'); b.type = 'button'; b.dataset.tab = id;
      b.addEventListener('click', () => openTab(id, true));
      $('#mg-tabs').append(b);
    });
    PALETTES.forEach((name) => {
      const b = el('button', `mg-swatch mg-sw-${name}`); b.type = 'button'; b.dataset.palette = name;
      b.addEventListener('click', () => applyPalette(name));
      $('#mg-palette').append(b);
    });
    $('#mg-measures').append(measure('pending', 'today'), measure('tasks', 'projects'), measure('warnings', 'system'));
    let searchTimer = 0;
    $('#mg-k-search').addEventListener('input', (e) => { knowledge.query = e.target.value; clearTimeout(searchTimer); searchTimer = setTimeout(buildKnowledgeNotes, SEARCH_DELAY_MS); });
    $('#mg-k-type').addEventListener('change', (e) => { knowledge.type = e.target.value; buildKnowledgeNotes(); });
    $('#mg-l-op').addEventListener('change', (e) => { logOperation = e.target.value; buildLogList(); });
    $('#mg-d-close').addEventListener('click', closeDrawer);
    $('#mg-overlay').addEventListener('click', closeDrawer);
    document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeDrawer(); });
    setFormats(); applyLanguage(); applyPalette(PALETTES[0]);
  }

  /* ---------- Data arrival ---------- */
  function dataArrived() {
    const meta = rows('meta')[0];
    const next = meta && Object.hasOwn(STRINGS, meta.language) ? meta.language : DEFAULT_LANGUAGE;
    if (next !== lang) { lang = next; setFormats(); applyLanguage(); }
    noteIndex = new Map(rows('notes').map((n) => [n.key, n]));
    writeHeader();
    dirty = new Set(TABS);
    buildOpen();
  }
  // Cheap signature: status, length and a folded summary of the fields that change in place; data is not turned into JSON
  const rowSignature = (r) => (r && typeof r === 'object'
    ? `${r.key}~${r.status ?? ''}~${r.updated ?? ''}~${r.done ?? ''}~${r.closed ?? ''}~${r.cost_usd ?? ''}~${r.language ?? ''}~${typeof r.text === 'string' ? r.text.length : ''}`
    : String(r));
  const fold = (list) => { let h = 0; for (const r of list) { const s = rowSignature(r); for (let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) | 0; } return h; };
  const signature = () => DATASETS.map((id) => { const d = dash.data(id) || {}; const list = Array.isArray(d.data) ? d.data : []; return `${id}:${d.status}:${list.length}:${fold(list)}`; }).join('|');

  setup();
  if (typeof dash === 'undefined' || typeof dash.data !== 'function') { $('#mg-title').textContent = S().noDash; return; }
  const requested = new URLSearchParams(location.search).get('tab');
  let lastSignature = signature();
  let buildTimer = 0;
  active = TABS.includes(requested) ? requested : 'today';
  dataArrived();
  openTab(active, false);
  dash.onData(() => {
    const now = signature();
    if (now === lastSignature) return;
    lastSignature = now;
    clearTimeout(buildTimer);
    if (DATASETS.some((id) => statusOf(id) === 'loading')) buildTimer = setTimeout(dataArrived, BUILD_DELAY_MS);
    else dataArrived();
  });
})();
</script>
