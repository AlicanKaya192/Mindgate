<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WebGL good</title>
<style>
  body { margin: 0; font: 16px/1.5 Arial, sans-serif; background: #f7f6f3; color: #1c1b19; }
  main { max-width: 640px; margin: 0 auto; padding: 24px 16px; }
  canvas { display: block; width: 100%; height: 120px; }
  @keyframes spin { to { transform: rotate(1turn); } }
  .spinner { width: 24px; height: 24px; background: #8f1a52; animation: spin 2s linear infinite; }
  @media (prefers-reduced-motion: reduce) { .spinner { animation: none; } }
</style>
</head>
<body>
<main>
  <h1>One scene</h1>
  <canvas></canvas>
  <div class="spinner"></div>
</main>
<script>
  // One context; with reduced motion it draws one frame and sets up no loop.
  const gl = document.querySelector("canvas").getContext("webgl");
  const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
  let angle = 0;
  function draw() {
    angle += 0.02;
    if (gl) { gl.clearColor(Math.abs(Math.sin(angle)), 0.2, 0.3, 1); gl.clear(gl.COLOR_BUFFER_BIT); }
    if (!reduced) requestAnimationFrame(draw);
  }
  requestAnimationFrame(draw);
</script>
</body>
</html>
