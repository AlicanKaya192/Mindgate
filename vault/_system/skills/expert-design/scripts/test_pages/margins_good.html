<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Equal margins</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font: 16px/1.5 Arial, sans-serif; background: #f7f6f3; color: #1c1b19; }
  main { max-width: 640px; margin: 0 auto; padding: 24px 16px; }
  button { font: inherit; min-width: 48px; min-height: 48px; }
</style>
</head>
<body>
<main>
  <h1>Centered content</h1>
  <p>The left and right margins are the same at every width; the content box is centered.</p>
  <button type="button">Continue</button>
</main>
</body>
</html>
