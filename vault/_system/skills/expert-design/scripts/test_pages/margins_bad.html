<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Unequal margins</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font: 16px/1.5 Arial, sans-serif; background: #f7f6f3; color: #1c1b19; }
  main { margin: 0 64px 0 16px; padding: 24px 0; }
  button { font: inherit; min-width: 48px; min-height: 48px; }
</style>
</head>
<body>
<main>
  <h1>Shifted content</h1>
  <p>The left margin is 16 and the right margin 64 pixels; the content looks pushed to the left.</p>
  <button type="button">Continue</button>
</main>
</body>
</html>
