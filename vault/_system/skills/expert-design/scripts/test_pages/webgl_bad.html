<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WebGL bad</title>
<style>
  body { margin: 0; font: 16px/1.5 Arial, sans-serif; background: #f7f6f3; color: #1c1b19; }
  main { max-width: 640px; margin: 0 auto; padding: 24px 16px; }
  canvas { display: block; width: 100%; height: 40px; margin-bottom: 8px; }
  @keyframes spin { to { transform: rotate(1turn); } }
  .spinner { width: 24px; height: 24px; background: #8f1a52; animation: spin 2s linear infinite; }
</style>
</head>
<body>
<main>
  <h1>Five scenes</h1>
  <canvas></canvas><canvas></canvas><canvas></canvas><canvas></canvas><canvas></canvas>
  <div class="spinner"></div>
</main>
<script>
  // Opens five WebGL contexts and keeps the loop running without looking at the reduced-motion request.
  const contexts = [...document.querySelectorAll("canvas")].map((c) => c.getContext("webgl"));
  let angle = 0;
  function draw() {
    angle += 0.02;
    for (const gl of contexts) if (gl) { gl.clearColor(Math.abs(Math.sin(angle)), 0.2, 0.3, 1); gl.clear(gl.COLOR_BUFFER_BIT); }
    requestAnimationFrame(draw);
  }
  requestAnimationFrame(draw);
</script>
</body>
</html>
